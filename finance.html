<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#06100d">
<title>المالية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06100d; --surface:#0f1f1a; --line:rgba(255,255,255,.075);
  --text:#ecf5f0; --muted:#8fa89e; --faint:#5f7a70;
  --emerald:#2fd8a4; --gold:#e6c36a; --coral:#ff7a6e; --sky:#6db7ff; --amber:#ffa35c;
  --radius:20px;
  --font:'IBM Plex Sans Arabic','Noto Sans Arabic','Segoe UI',system-ui,Tahoma,sans-serif;
  --display:'Reem Kufi','IBM Plex Sans Arabic','Noto Kufi Arabic','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{
  font-family:var(--font);color:var(--text);line-height:1.55;min-height:100vh;
  background:
    radial-gradient(1100px 560px at 88% -8%,rgba(47,216,164,.11),transparent 60%),
    radial-gradient(900px 520px at -5% 18%,rgba(230,195,106,.07),transparent 55%),
    var(--bg);
  background-attachment:fixed;
  padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;color:inherit}
.app{max-width:1120px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.cur{font-size:.42em;color:var(--gold);margin-inline-start:6px;font-weight:600;letter-spacing:0}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.pos{color:var(--emerald)} .neg{color:var(--coral)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:23px;color:#1a1405;flex-shrink:0;
  background:linear-gradient(135deg,#f6dd92,#c99a3a);box-shadow:0 6px 22px rgba(230,195,106,.28)}
.brand-t{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.1}
.brand-s{font-size:11.5px;color:var(--muted)}
.top-actions{display:flex;gap:8px;align-items:center}
.chip-btn{font-size:11.5px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);transition:.2s;white-space:nowrap}
.chip-btn.on{background:rgba(230,195,106,.12);border-color:rgba(230,195,106,.45);color:var(--gold)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;flex-shrink:0}
.icon-btn svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.banner{display:none;margin-bottom:14px;padding:11px 14px;border-radius:14px;font-size:12.5px;line-height:1.7;color:#f1dca0;
  background:linear-gradient(90deg,rgba(230,195,106,.14),rgba(230,195,106,.05));border:1px solid rgba(230,195,106,.3)}
.banner.on{display:block}
.banner button{color:var(--gold);text-decoration:underline;font-size:12.5px;padding:0 4px}

/* ---------- tabs ---------- */
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(7,17,14,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--faint);padding:6px 0;border-radius:12px;transition:color .2s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.tab.on{color:var(--emerald)}
.tab.on svg{filter:drop-shadow(0 0 7px rgba(47,216,164,.55))}

/* ---------- layout ---------- */
.grid{display:grid;gap:14px;margin-bottom:14px}
.card{position:relative;border-radius:var(--radius);padding:18px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.016))}
.card>h3,.card-h{font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:10px;font-weight:600;padding:2px 9px;border-radius:99px;background:rgba(230,195,106,.14);color:var(--gold);border:1px solid rgba(230,195,106,.3)}
.tag.warn{background:rgba(255,122,110,.12);color:var(--coral);border-color:rgba(255,122,110,.3)}
.tag.ok{background:rgba(47,216,164,.12);color:var(--emerald);border-color:rgba(47,216,164,.3)}
.link{font-size:12px;color:var(--emerald)}
.empty{text-align:center;color:var(--faint);padding:26px 10px;font-size:13px;line-height:1.8}
.note{font-size:11.5px;color:var(--faint);line-height:1.8;margin-top:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-size:20px;font-weight:600}
.mnav{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;padding:3px}
.mnav button{width:32px;height:32px;border-radius:99px;font-size:18px;color:var(--muted);display:grid;place-items:center}
.mnav button:active{background:rgba(255,255,255,.08)}
.mnav span{font-size:13px;font-weight:600;min-width:104px;text-align:center}

/* ---------- hero ---------- */
.hero{overflow:hidden;padding:22px 20px;border:1px solid rgba(47,216,164,.2);
  background:radial-gradient(520px 240px at 92% 0%,rgba(47,216,164,.24),transparent 62%),linear-gradient(135deg,#0e3b31,#0a2722 55%,#08211d)}
.hero::before{content:"";position:absolute;inset-inline:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(230,195,106,.8),transparent)}
.hero-row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.hero-l{min-width:0}
.lbl{font-size:12px;color:rgba(236,245,240,.65)}
.big{font-family:var(--display);font-size:clamp(34px,9.5vw,54px);font-weight:700;letter-spacing:-.5px;line-height:1.12;margin:2px 0 4px}
.hero-sub{font-size:12.5px;color:rgba(236,245,240,.72)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}
.kpi{background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 13px}
.kpi .k{font-size:11px;color:rgba(236,245,240,.6);display:flex;align-items:center;gap:6px}
.kpi .k i{width:7px;height:7px;border-radius:50%;display:inline-block}
.kpi .v{font-size:17px;font-weight:600;margin-top:2px}
.callout{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;padding:14px 16px;border-radius:16px;
  background:linear-gradient(90deg,rgba(255,163,92,.14),rgba(255,163,92,.04));border:1px solid rgba(255,163,92,.32);font-size:13px;line-height:1.7}
.callout b{color:var(--amber)}

/* ---------- rings / donut ---------- */
.ring{position:relative;flex-shrink:0}
.ring svg,.donut svg{width:100%;height:100%;display:block}
.ring-c,.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.25}
.ring-c b{font-family:var(--display);font-size:24px}
.ring-c small{font-size:10.5px;color:var(--muted)}
.arc,.dseg{animation:arc 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes arc{from{stroke-dasharray:0 100}}
.donut{position:relative;width:176px;height:176px;flex-shrink:0}
.donut-c b{font-family:var(--display);font-size:20px}
.donut-c small{font-size:10.5px;color:var(--muted)}
.dn-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.legend{flex:1;min-width:170px;display:flex;flex-direction:column;gap:9px}
.lg{display:flex;align-items:center;gap:9px;font-size:12.5px}
.lg i{width:10px;height:10px;border-radius:4px;flex-shrink:0}
.lg .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .p{color:var(--faint);font-size:11px;width:34px;text-align:start}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);fill:var(--faint);font-size:11px}
.leg-inline{display:flex;gap:14px;font-size:11px;color:var(--muted);font-weight:400}
.leg-inline i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}

/* ---------- bars / lists ---------- */
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.row .mid{flex:1;min-width:0}
.row .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:11.5px;color:var(--faint)}
.row .a{font-size:15px;font-weight:600;text-align:end;white-space:nowrap}
.x{width:28px;height:28px;border-radius:9px;color:var(--faint);font-size:14px;display:grid;place-items:center;flex-shrink:0}
.x:hover,.x:active{background:rgba(255,122,110,.14);color:var(--coral)}
.day-h{font-size:11.5px;color:var(--faint);margin:14px 2px 2px;font-weight:600}
.day-h:first-child{margin-top:0}

/* ---------- debts ---------- */
.d-sum{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.stat{flex:1;min-width:120px}
.stat .l{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:19px;font-weight:600;margin-top:1px}
.tl{display:flex;height:38px;border-radius:12px;overflow:hidden;gap:2px;margin:14px 0 10px}
.tl>div{min-width:6px;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#1a1208;overflow:hidden;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;direction:ltr}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--emerald),var(--gold))}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--emerald),var(--gold))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-9px;border:4px solid var(--emerald);box-shadow:0 2px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--emerald)}
.sim-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.big2{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
.seg{display:flex;background:rgba(255,255,255,.05);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:12.5px;color:var(--muted);transition:.2s}
.seg button.on{background:var(--emerald);color:#04150f;font-weight:600}
.btn{padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:.2s}
.btn.pri{background:linear-gradient(135deg,#34e0ab,#17a47c);color:#03140e;border:none}
.btn.gold{background:rgba(230,195,106,.14);border-color:rgba(230,195,106,.4);color:var(--gold)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn:active{transform:scale(.97)}
.dcard{padding:16px}
.dcard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.dcard-h .t{font-weight:600;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.dcard-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.pill-sel{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:12px;max-width:150px}
.pill-sel option{background:#0f1f1a}

/* ---------- budget ---------- */
.env{padding:14px 0;border-bottom:1px solid var(--line)}
.env:last-child{border-bottom:none}
.env-h{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.env-in{width:96px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:end;font-size:14px;direction:ltr}
.env-in:focus{outline:none;border-color:var(--emerald)}

/* ---------- fab / dialog / toast ---------- */
.spark{width:92px;height:26px;flex-shrink:0}
.pos-sum{display:flex;align-items:center;gap:10px;flex:1 1 100%;font-size:11.5px;padding-top:8px}
.badge-pl.zero{background:rgba(255,255,255,.07);color:var(--muted)}
.pos-act{display:flex;gap:7px;flex-wrap:wrap;padding:0 0 12px;border-bottom:1px solid var(--line);margin-top:-2px}
.pos-act:last-child{border-bottom:none}
.badge-pl{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px}
.badge-pl.up{background:rgba(47,216,164,.14);color:var(--emerald)}.badge-pl.dn{background:rgba(255,122,110,.14);color:var(--coral)}
.gc-res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.gc-res>div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px;padding:9px 10px}
.gc-res>div>span:first-child{display:block;font-size:10.5px;color:var(--muted);line-height:1.4}.gc-res b{font-size:15px;color:var(--text)}
.rng{margin:2px 0 8px}.rng-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.rng-h b{color:var(--text)}
.tip-t{font-size:15.5px;line-height:1.9;margin:2px 0 12px}
.tip-f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.obs{font-size:13px;line-height:1.8;color:#d6e4dd;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:8px}
.site-nav{display:flex;gap:4px;max-width:360px;margin:0 auto 14px;padding:4px;border-radius:16px;background:rgba(9,20,17,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:45}
.site-nav a{flex:1;text-align:center;font-size:13px;font-weight:600;padding:9px 10px;border-radius:12px;color:var(--muted);text-decoration:none;transition:.2s}
.site-nav a.on{background:linear-gradient(135deg,rgba(47,216,164,.2),rgba(47,216,164,.08));color:var(--emerald);box-shadow:inset 0 0 0 1px rgba(47,216,164,.3)}
.subbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px}
.sync-chip{font-size:11px;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);line-height:1.5}
.sync-chip.ok{background:rgba(47,216,164,.12);border-color:rgba(47,216,164,.35);color:var(--emerald)}
.sync-chip.warn{background:rgba(255,163,92,.12);border-color:rgba(255,163,92,.35);color:#ffc58f}
.sync-chip.err{background:rgba(255,122,110,.12);border-color:rgba(255,122,110,.35);color:var(--coral)}
.tab.add{flex:0 0 76px;color:var(--muted)}
.tab.add .plus{width:56px;height:56px;border-radius:20px;margin-top:-32px;background:linear-gradient(135deg,#34e0ab,#12a077);
  box-shadow:0 10px 28px rgba(47,216,164,.42),0 0 0 5px rgba(7,17,14,.92);display:grid;place-items:center;transition:transform .15s}
.tab.add:active .plus{transform:scale(.92)}
.tab.add .plus svg{width:26px;height:26px;stroke:#03140e;stroke-width:2.6;filter:none}
dialog{margin:auto auto 0;width:min(460px,100vw);max-height:92vh;max-height:calc(100dvh - 10px);overflow:auto;border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;
  background:#0c1a16;color:var(--text);padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));direction:rtl}
dialog::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
dialog[open]{animation:sheet .28s cubic-bezier(.2,.9,.3,1)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
.dlg-t{font-family:var(--display);font-size:20px;font-weight:600;margin-bottom:4px}
.dlg-s{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.7}
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;padding:13px 14px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:15px}
.inp:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(47,216,164,.14)}
.inp.money{font-size:24px;font-weight:600;direction:ltr;text-align:end;font-family:var(--display)}
select.inp option{background:#0f1f1a}
.cats{display:flex;flex-wrap:wrap;gap:7px}
.cat{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12.5px;display:flex;align-items:center;gap:6px;transition:.15s}
.cat.on{font-weight:600}
.dlg-a{display:flex;gap:10px;margin-top:18px}
.dlg-foot{position:sticky;bottom:-20px;margin:6px -18px -20px;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(12,26,22,0),#0c1a16 28%)}
.dlg-foot .dlg-a{margin-top:0}.dlg-foot .err{margin:0 0 8px;min-height:0}
.err.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(6px)}40%,80%{transform:translateX(-6px)}}
.guide{font-size:13.5px;line-height:1.85;color:#d6e4dd}
.guide h4{font-family:var(--display);font-size:16px;color:var(--gold);margin:16px 0 4px;font-weight:600}
.guide p{margin-bottom:9px}.guide .lead{font-size:14px;color:var(--text)}
.guide ol,.guide ul{padding-inline-start:20px;margin-bottom:8px}.guide li{margin-bottom:7px}
.guide b{color:var(--text)}
.dlg-a .btn{flex:1;padding:14px}
.err{color:var(--coral);font-size:12px;margin-top:8px;min-height:16px}
.toast{position:fixed;inset-inline:0;bottom:calc(150px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;z-index:60;
  background:#16352c;border:1px solid rgba(47,216,164,.4);padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transform:translateY(10px);transition:.3s}
.toast.on{opacity:1;transform:none}

@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){
  body{padding-bottom:50px}
  .tabs{position:sticky;top:10px;inset-inline:auto;bottom:auto;max-width:600px;margin:0 auto 18px;border:1px solid var(--line);border-radius:18px;padding:6px}
  .tab{flex-direction:row;justify-content:center;gap:8px;font-size:13px;padding:10px 6px}
  .tab.on{background:rgba(47,216,164,.1)}
  .g2{grid-template-columns:1fr 1fr}
  .g-hero{grid-template-columns:1.55fr 1fr}
  .tab.add{flex:0 0 auto;flex-direction:row;padding:8px 16px;color:var(--emerald)}
  .tab.add .plus{width:30px;height:30px;border-radius:10px;margin-top:0;box-shadow:none}
  .tab.add .plus svg{width:17px;height:17px}
  .toast{bottom:40px}
  dialog{margin:auto;border-radius:26px;border-bottom:1px solid var(--line)}
}
@media print{.tabs,.top-actions,.site-nav{display:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="site-nav" aria-label="الأقسام"><a href="index.html">📚 الجامعة</a><a class="on" href="finance.html">💰 المالية</a></nav>
  <header class="top">

<script>
'use strict'
/* =====================================================================
   المالية — النسخة 1 (تصميم + منطق محلي). البيانات بالهللات (أعداد صحيحة).
   لاحقاً: نربط save() بـ Firestore كما سوينا في تتبّع الجامعة.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)]
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7)
const clone=o=>JSON.parse(JSON.stringify(o))
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر']
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']
const pad=n=>String(n).padStart(2,'0')
const dstr=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d)
const todayStr=()=>{const t=new Date();return dstr(t.getFullYear(),t.getMonth(),t.getDate())}
const ymOf=s=>{const p=s.split('-');return +p[0]*12+(+p[1]-1)}
const ymLabel=ym=>MONTHS[ym%12]+' '+Math.floor(ym/12)
const daysIn=ym=>new Date(Math.floor(ym/12),ym%12+1,0).getDate()
const dayOf=s=>+s.split('-')[2]
const fullDate=s=>{const [y,m,d]=s.split('-').map(Number);return DAYS[new Date(y,m-1,d).getDay()]+' '+d+' '+MONTHS[m-1]}
const nowYM=()=>{const t=new Date();return t.getFullYear()*12+t.getMonth()}

const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0})
const nf2=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
const mny=h=>{const v=h/100;return Number.isInteger(v)?nf0.format(v):nf2.format(v)}
const amt=(h,cls='')=>`<span class="num ${cls}">${mny(h)}</span>`
const amts=(h,sign)=>`<span class="num">${sign}${mny(h)}</span>`
const dateAr=s=>{if(!s)return '';const [y,m,d]=s.split('-').map(Number);return d+' '+MONTHS[m-1]+' '+y}
const CUR='<span class="cur">ر.س</span>'
function parseMoney(s){
  s=String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
   .replace(/[٬,\s]/g,'').replace('٫','.')
  const n=parseFloat(s); return isFinite(n)?Math.round(n*100):NaN
}

/* ---------- الفئات ---------- */
const CAT_DEFAULTS=[
  {id:'food',name:'الغذاء',icon:'🍽️',color:'#2fd8a4'},
  {id:'transport',name:'المواصلات',icon:'🚗',color:'#6db7ff'},
  {id:'bills',name:'فواتير واشتراكات',icon:'📱',color:'#a98bff'},
  {id:'gym',name:'الرياضة والصحة',icon:'🏋️',color:'#ffa35c'},
  {id:'personal',name:'شخصي وترفيه',icon:'🛍️',color:'#f77fb5'},
  {id:'study',name:'الجامعة والدراسة',icon:'🎓',color:'#e6c36a'},
  {id:'charity',name:'صدقات',icon:'🤲',color:'#52e0d0'},
  {id:'other',name:'أخرى',icon:'📦',color:'#93a4b8'}
]
const INCOME_CATS=[
  {id:'salary',name:'الراتب',icon:'💼',color:'#2fd8a4'},
  {id:'extra',name:'دخل إضافي',icon:'✨',color:'#e6c36a'}
]
const KINDS={fund:{name:'صندوق',color:'#6db7ff'},stock:{name:'سهم',color:'#a98bff'},gold:{name:'ذهب',color:'#e6c36a'},silver:{name:'فضة',color:'#c3ccd8'},cash:{name:'نقدي',color:'#2fd8a4'},other:{name:'أخرى',color:'#93a4b8'}}
const UNIT={gold:'جرام',silver:'جرام',stock:'سهم',fund:'وحدة',cash:'',other:'وحدة'}
const PAL=['#ff7a6e','#ffa35c','#e6c36a','#6db7ff','#a98bff','#f77fb5','#52e0d0']

/* ---------- البيانات ---------- */
const KEY='fin_real_v1', KEY_DEMO='fin_demo_on'
// أرقامك كما ذكرتها (آخر تحديث): راجعها وعدّلها من تبويب الديون
function seedDebts(){return[
  {id:'d1',name:'دين ١',orig:880000,holdDate:'2024-09-02',src:'bank',verified:true},
  {id:'d2',name:'دين ٢',orig:35000, holdDate:'2024-09-02',src:'bank',verified:true},
  {id:'d3',name:'دين ٣',orig:80000, holdDate:'2024-12-03',src:'bank',verified:true},
  {id:'d4',name:'دين ٤',orig:24000, holdDate:'2026-10-13',src:'bank',verified:true},
  {id:'d5',name:'مولم',orig:104500,holdDate:'',src:'other',verified:false}
]}
function freshReal(){return{
  v:3,
  // الراتب 2,600 — يبقى لك 2,500 — ينحجز 100 تلقائياً للديون
  settings:{salary:260000,payday:1,hold:10000,holdSet:true,bankDebt:962594,order:'newest',investTarget:0},
  cats:CAT_DEFAULTS.map(c=>({...c,budget:0})),
  tx:[],payments:[],invest:[],
  debts:seedDebts()
}}
const OLD_SEED={d1:880000,d2:50000,d3:80000,d4:24000,d5:109124}
function migrate(o){
  if((o.v||1)<2){
    // نبدّل الديون فقط لو ما لمستها (نفس أرقام النسخة الأولى وبدون تسجيلات)
    if(!(o.payments||[]).length&&o.debts.length===5&&o.debts.every(x=>OLD_SEED[x.id]===x.orig))o.debts=seedDebts()
    if(!o.settings.holdSet){o.settings.hold=10000;o.settings.holdSet=true}
    o.v=2
  }
  if((o.v||1)<3){
    // لاحظت إن الحجز يروح لأحدث دين أولاً
    if(o.settings.order==='oldest')o.settings.order='newest'
    o.settings.investTarget=o.settings.investTarget||0
    o.v=3
  }
  return o
}
function load(){try{const r=localStorage.getItem(KEY);return r?migrate(JSON.parse(r)):null}catch(e){return null}}
let REAL=load()||freshReal()
let DEMO=null
let noStore=false
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){noStore=true}
let demoOn=false
try{demoOn=localStorage.getItem(KEY_DEMO)==='1'}catch(e){}
const D=()=>demoOn?(DEMO||(DEMO=buildDemo(REAL))):REAL
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(REAL))}catch(e){}}
function persist(){ if(!demoOn){saveLocal();if(window.__finPush)window.__finPush()} }

/* ---------- منطق الديون ---------- */
const paidOf=(d,id)=>d.payments.filter(p=>p.debtId===id).reduce((a,p)=>a+p.amount,0)
const debtList=d=>d.debts.map(x=>({...x,paid:Math.min(x.orig,paidOf(d,x.id)),remaining:Math.max(0,x.orig-paidOf(d,x.id))}))
const MODE_S={newest:'الأحدث أولاً',oldest:'الأقدم أولاً',smallest:'الأصغر أولاً',largest:'الأكبر أولاً'}
const cmpDate=(a,b,dir)=>{if(!a&&!b)return 0;if(!a)return 1;if(!b)return -1;return a<b?-dir:a>b?dir:0} // بدون تاريخ = آخر الترتيب
function orderDebts(list,mode){
  const cmp={
    newest:(p,q)=>cmpDate(p.x.holdDate,q.x.holdDate,-1),
    oldest:(p,q)=>cmpDate(p.x.holdDate,q.x.holdDate,1),
    smallest:(p,q)=>p.x.remaining-q.x.remaining,
    largest:(p,q)=>q.x.remaining-p.x.remaining
  }[mode]||((p,q)=>cmpDate(p.x.holdDate,q.x.holdDate,-1))
  return list.filter(x=>x.remaining>0).map((x,i)=>({x,i})).sort((p,q)=>cmp(p,q)||p.i-q.i).map(o=>o.x)
}
function simulate(list,H,mode){
  if(H<=0)return null
  let t=0;const segs=[]
  orderDebts(list,mode).forEach(x=>{const m=x.remaining/H;segs.push({debt:x,start:t,end:t+m,months:m});t+=m})
  return {segs,total:t}
}
function nextPayYM(d){const t=new Date();const ym=nowYM();return t.getDate()>d.settings.payday?ym+1:ym}
const etaLabel=(months,startYM)=>ymLabel(startYM+Math.max(0,Math.ceil(months-1e-9)-1))
const age=(ds)=>{if(!ds)return null;const m=nowYM()-ymOf(ds);return m<=0?'هذا الشهر':m<12?m+' شهر':(Math.floor(m/12)+' سنة'+(m%12?' و'+(m%12)+' شهر':''))}

/* ---------- إحصاءات الشهر ---------- */
function monthStats(d,ym){
  let inc=0,exp=0,hold=0,inv=0;const byCat={}
  d.tx.forEach(t=>{if(ymOf(t.date)!==ym)return;if(t.type==='income')inc+=t.amount;else{exp+=t.amount;byCat[t.cat]=(byCat[t.cat]||0)+t.amount}})
  d.payments.forEach(p=>{if(ymOf(p.date)===ym)hold+=p.amount})
  d.invest.forEach(i=>(i.hist||[]).forEach(h=>{if(!h.adj&&ymOf(h.date)===ym)inv+=h.amount}))
  return {inc,exp,hold,inv,byCat}
}
const catOf=(d,id)=>d.cats.find(c=>c.id===id)||INCOME_CATS.find(c=>c.id===id)||{id,name:'—',icon:'•',color:'#93a4b8'}

/* ---------- بيانات المعاينة التجريبية (في الذاكرة فقط) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildDemo(real){
  const d=clone(real);d.settings.hold=150000;d.settings.holdSet=true
  const bud={food:36000,transport:10000,bills:21000,gym:15000,personal:10000,study:5000,charity:4000,other:4000}
  d.cats.forEach(c=>{c.budget=bud[c.id]||0})
  const now=new Date(),cur=nowYM(),td=now.getDate(),pay=real.settings.payday
  let n=0;const nid=()=>'x'+(++n)
  const rem={};d.debts.forEach(x=>rem[x.id]=x.orig)
  const notes={food:['سوبرماركت','مطعم','قهوة','غداء','خضار وفواكه'],transport:['بنزين','مشوار','مواصلات'],personal:['ملابس','ترفيه','هدية'],study:['طباعة','كتاب','أدوات'],charity:['صدقة جمعة'],other:['متفرقات']}
  d.invest=[]
  for(let k=5;k>=0;k--){
    const ym=cur-k,y=Math.floor(ym/12),m=ym%12,last=k===0?Math.min(td,daysIn(ym)):daysIn(ym),r=rng(9100+ym*7)
    const add=(cat,day,a,note)=>d.tx.push({id:nid(),type:'expense',cat,amount:Math.max(500,Math.round(a/50)*50),date:dstr(y,m,day),note})
    const pick=a=>a[Math.floor(r()*a.length)]
    if(pay<=last){
      d.tx.push({id:nid(),type:'income',cat:'salary',amount:real.settings.salary,date:dstr(y,m,pay),note:'الراتب'})
      let left=150000
      for(const x of orderDebts(d.debts.map(z=>({...z,remaining:rem[z.id]})),d.settings.order)){
        if(left<=0)break;const a=Math.min(left,rem[x.id]);if(a<=0)continue
        d.payments.push({id:nid(),debtId:x.id,amount:a,date:dstr(y,m,pay)});rem[x.id]-=a;left-=a
      }
    }
    for(let day=1;day<=last;day++){
      const wd=new Date(y,m,day).getDay()
      if(r()<.5)add('food',day,900+r()*2100,pick(notes.food))
      if(r()<.2)add('transport',day,800+r()*1900,pick(notes.transport))
      if(r()<.07)add('personal',day,2000+r()*5500,pick(notes.personal))
      if(r()<.04)add('study',day,1500+r()*3500,pick(notes.study))
      if(wd===5&&r()<.6)add('charity',day,1000+r()*1500,notes.charity[0])
      if(r()<.035)add('other',day,2000+r()*5500,notes.other[0])
      if(day===3)add('gym',day,15000,'اشتراك الجيم')
      if(day===5)add('bills',day,7900,'باقة الجوال')
      if(day===12)add('bills',day,5000,'اشتراكات')
    }
  }
  // مراكز استثمار تجريبية بإيداعات شهرية وتاريخ قيمة أسبوعي
  const rr=rng(4242)
  const defs=[
    {id:'i1',name:'صندوق مؤشر الأسهم',kind:'fund',symbol:'',units:150,price:10.83,invested:150000},
    {id:'i2',name:'ذهب',kind:'gold',symbol:'',units:2,price:434.5,invested:80000},
    {id:'i3',name:'ادخار الطوارئ',kind:'cash',symbol:'',units:0,price:0,invested:100000,value:100000},
    {id:'i4',name:'أرامكو',kind:'stock',symbol:'2222',units:10,price:26.1,invested:25000}
  ]
  d.invest=defs.map(df=>{
    const value=df.value??Math.round(df.units*df.price*100),parts=[.36,.16,.16,.16,.16],hist=[]
    let cum=0
    parts.forEach((pt,k)=>{const ym=cur-(4-k),amount=k===4?df.invested-cum:Math.round(df.invested*pt/100)*100;cum+=amount;hist.push({date:dstr(Math.floor(ym/12),ym%12,2),amount})})
    const vh=[],tdy=new Date()
    for(let k=0;k<=20;k++){
      const t=new Date(tdy);t.setDate(t.getDate()-(20-k)*7);const ds=dstr(t.getFullYear(),t.getMonth(),t.getDate())
      const invAt=hist.filter(h=>h.date<=ds).reduce((a,h)=>a+h.amount,0);if(!invAt)continue
      const ratio=df.kind==='cash'?1:1+(value/df.invested-1)*(k/20)+(rr()-.5)*.045
      vh.push({date:ds,value:k===20?value:Math.round(invAt*ratio)})
    }
    return {id:df.id,name:df.name,kind:df.kind,symbol:df.symbol,units:df.units,price:df.price,invested:df.invested,value,hist,vh}
  })
  d.settings.investTarget=60000
  d.settings.bankDebt=debtList(d).filter(x=>x.src==='bank').reduce((a,x)=>a+x.remaining,0)-71406
  return d
}

/* ---------- رسوم SVG ---------- */
let gid=0
function ring(pct,{size=128,c1='#2fd8a4',c2,th=9,center=''}={}){
  const id='rg'+(++gid),p=Math.max(0,Math.min(100,pct))
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2||c1}"/></linearGradient></defs>
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="${th}"/>
  ${p>0.4?`<circle class="arc" cx="50" cy="50" r="42" fill="none" stroke="url(#${id})" stroke-width="${th}" stroke-linecap="round" pathLength="100" stroke-dasharray="${p} 100" transform="rotate(-90 50 50)"/>`:''}</svg><div class="ring-c">${center}</div></div>`
}
function donut(segs,top,bot){
  const total=segs.reduce((a,s)=>a+s.value,0);let off=0;const gap=segs.length>1?1.3:0
  const arcs=segs.map(s=>{const p=total?s.value/total*100:0,dash=Math.max(0,p-gap)
    const el=`<circle class="dseg" cx="50" cy="50" r="38" fill="none" stroke="${s.color}" stroke-width="12" pathLength="100" stroke-dasharray="${dash} ${100-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=p;return el}).join('')
  return `<div class="donut"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="12"/>${arcs}</svg><div class="donut-c"><b>${top}</b><small>${bot}</small></div></div>`
}
function lineChart(cum,n,todayIdx,budget){
  const W=600,H=210,pr=10,pl=10,pt=16,pb=26
  const max=Math.max(budget,cum[todayIdx]||0,1)*1.1
  const x=i=>W-pr-(i/(n-1))*(W-pl-pr), y=v=>pt+(1-v/max)*(H-pt-pb)
  let path='',area=''
  for(let i=0;i<=todayIdx;i++)path+=(i?'L':'M')+x(i).toFixed(1)+' '+y(cum[i]).toFixed(1)
  area=path+`L${x(todayIdx).toFixed(1)} ${y(0)}L${x(0).toFixed(1)} ${y(0)}Z`
  const over=cum[todayIdx]>budget*((todayIdx+1)/n)*1.02
  const col=over?'#ff7a6e':'#2fd8a4',id='lg'+(++gid)
  const grid=[0,.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(max/1.1*f).toFixed(1)}" y2="${y(max/1.1*f).toFixed(1)}" stroke="rgba(255,255,255,.06)" stroke-dasharray="3 5"/>`).join('')
  const ticks=[1,Math.round(n/3),Math.round(n*2/3),n].map(dn=>`<text x="${x(dn-1).toFixed(1)}" y="${H-6}" text-anchor="middle">${dn}</text>`).join('')
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".38"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
   ${grid}<line x1="${x(0)}" y1="${y(0)}" x2="${x(n-1)}" y2="${y(budget).toFixed(1)}" stroke="#e6c36a" stroke-width="1.8" stroke-dasharray="6 6" opacity=".85"/>
   <path d="${area}" fill="url(#${id})"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${x(todayIdx).toFixed(1)}" cy="${y(cum[todayIdx]).toFixed(1)}" r="5" fill="${col}" stroke="#06100d" stroke-width="2.5"/>${ticks}</svg>`
}
function barsChart(items){
  const W=600,H=210,pt=14,pb=28,n=items.length,slot=(W-20)/n,bw=Math.min(24,slot*.28)
  const max=Math.max(...items.map(i=>Math.max(i.inc,i.exp)),1)*1.1,y=v=>pt+(1-v/max)*(H-pt-pb)

function growth(m,years,r){ // سيناريو: إيداع شهري ثابت + عائد سنوي مفترض (مو توقع)

}

function obsList(d){
  const list=d.invest,out=[]
  if(!list.length)return ['ما عندك مراكز بعد: ابدأ بمركز واحد بسيط وسجّل إيداعك فيه.']
  const tot=list.reduce((a,x)=>a+x.value,0),inv=list.reduce((a,x)=>a+x.invested,0)
  if(list.length===1)out.push('عندك مركز واحد فقط: كل المحفظة تتحرك معه.')
  const top=[...list].sort((a,b)=>b.value-a.value)[0]
  if(list.length>1&&tot&&top.value/tot>.6)out.push('مركز «'+esc(top.name)+'» يمثل '+Math.round(top.value/tot*100)+'% من قيمة محفظتك.')
  if(inv&&tot<inv)out.push('المحفظة حالياً أقل من المستثمر بنسبة '+((inv-tot)/inv*100).toFixed(1)+'%. هذي خسارة على الورق، ما تتحقق إلا بالبيع.')
  const tgt=d.settings.investTarget||0,fl=monthStats(d,nowYM()).inv
  if(tgt&&fl<tgt)out.push('هدفك هذا الشهر '+mny(tgt)+' ر.س وأضفت '+mny(fl)+'.')
  const stale=list.filter(x=>x.vh&&x.vh.length&&daysAgo(x.vh[x.vh.length-1].date)>7&&x.kind!=='cash').length
  if(stale)out.push('أسعار '+stale+' من مراكزك ما اتحدثت من أكثر من أسبوع.')
  return out
}

function pace(d,ym){
  const s=d.settings,st=monthStats(d,ym)
  const planned=st.inc>0?st.inc:s.salary
  const hold=st.hold>0?st.hold:(s.holdSet?s.hold:0)
  const base=planned-hold
  return {st,planned,hold,base,remain:planned-hold-st.exp-st.inv,expected:st.inc===0}
}

  const d=D(),ym=ui.ym,st=monthStats(d,ym)
  let list=d.tx.filter(t=>ymOf(t.date)===ym)
  if(ui.catFilter)list=list.filter(t=>t.cat===ui.catFilter)
  list.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0)
  const groups={};list.forEach(t=>(groups[t.date]=groups[t.date]||[]).push(t))
  const chips=[`<button class="cat ${!ui.catFilter?'on':''}" data-act="filt" data-id="" style="${!ui.catFilter?'border-color:#2fd8a4;background:#2fd8a422':''}">الكل</button>`]
    .concat(d.cats.map(c=>`<button class="cat ${ui.catFilter===c.id?'on':''}" data-act="filt" data-id="${c.id}" style="${ui.catFilter===c.id?`border-color:${c.color};background:${c.color}22`:''}">${c.icon} ${c.name}</button>`)).join('')
  return `<div class="sec-h"><h2>المعاملات</h2>${monthNav()}</div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px">
   <div class="card" style="padding:13px"><div class="faint" style="font-size:11px">دخل</div><div class="pos" style="font-size:16px;font-weight:600">${amt(st.inc)}</div></div>
   <div class="card" style="padding:13px"><div class="faint" style="font-size:11px">مصروف</div><div style="font-size:16px;font-weight:600">${amt(st.exp)}</div></div>
   <div class="card" style="padding:13px"><div class="faint" style="font-size:11px">الصافي</div><div class="${st.inc-st.exp<0?'neg':'pos'}" style="font-size:16px;font-weight:600">${amt(st.inc-st.exp)}</div></div>
  </div>
  <div class="cats" style="margin-bottom:14px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px">${chips}</div>
  <div class="card">${Object.keys(groups).length?Object.keys(groups).map(k=>`<div class="day-h">${fullDate(k)}</div>${groups[k].map(t=>txRow(t,true)).join('')}`).join(''):'<div class="empty">ما في معاملات'+(ui.catFilter?' بهذي الفئة':'')+' في '+ymLabel(ym)+'<br>اضغط + لإضافة معاملة</div>'}</div>`
}

const simExtra=()=>{const s=D().settings,auto=s.holdSet?Math.min(s.hold,ui.simH):0;return 'حجز تلقائي <b>'+mny(auto)+'</b> + إضافي منك <b>'+mny(ui.simH-auto)+'</b> شهرياً'}
function simOut(){
  const d=D(),s=d.settings,list=debtList(d),H=ui.simH,mode=ui.simMode
  const sim=simulate(list,H,mode),start=nextPayYM(d)
  if(!list.some(x=>x.remaining>0))return '<div class="empty">ما في ديون متبقية 🎉</div>'
  if(!sim)return '<div class="empty" style="padding:14px">حرّك المؤشر لتشوف كم تاخذ الديون</div>'
  const tl=sim.segs.map((g,i)=>`<div style="flex:${g.months};background:${PAL[i%PAL.length]}" title="${esc(g.debt.name)}">${g.months/sim.total>.13?esc(g.debt.name):''}</div>`).join('')
  const rows=sim.segs.map((g,i)=>`<div class="row" style="padding:8px 0"><div class="ico" style="width:10px;height:10px;border-radius:4px;background:${PAL[i%PAL.length]}"></div>
    <div class="mid"><div class="t" style="font-size:13px">${esc(g.debt.name)}</div><div class="s">${amt(g.debt.remaining)} ر.س</div></div><div class="a" style="font-size:12.5px;font-weight:500">${etaLabel(g.end,start)}</div></div>`).join('')
  const mths=sim.total
  return `<div class="muted" style="font-size:13px">تخلص كل الديون بعد <b style="color:var(--text)">${mths<1?'أقل من شهر':(mths>=12?(Math.floor(mths/12)+' سنة و ')+Math.ceil(mths%12)+' شهر':Math.ceil(mths)+' شهر')}</b> — آخر دفعة في <b style="color:var(--gold)">${etaLabel(sim.total,start)}</b></div>
    <div class="tl">${tl}</div>${rows}`
}

function viewDebts(){

  if(!ui.simMode)ui.simMode=s.order||'newest'
  const orig=list.reduce((a,x)=>a+x.orig,0),left=list.reduce((a,x)=>a+x.remaining,0),paidPct=orig?(orig-left)/orig*100:0
  const oldest=list.filter(x=>x.holdDate&&x.remaining>0).sort((a,b)=>a.holdDate<b.holdDate?-1:1)[0]
  const bankSum=list.filter(x=>x.src==='bank').reduce((a,x)=>a+x.remaining,0),diff=bankSum-s.bankDebt

  const rem={};d.debts.forEach(x=>rem[x.id]=x.orig)
  const verdict={}
  ;[...d.payments].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(p=>{
    if(p.debtId){const pred=orderDebts(d.debts.map(x=>({...x,remaining:rem[x.id]})),s.order)[0];verdict[p.id]=p.est?'est':(pred?(pred.id===p.debtId):null);rem[p.debtId]=Math.max(0,rem[p.debtId]-p.amount)}
  })
  const pays=[...d.payments].sort((a,b)=>a.date<b.date?1:-1)
  const dcards=list.map(x=>{
    const pct=x.orig?x.paid/x.orig*100:0,a=age(x.holdDate)
    return `<div class="card dcard"><div class="dcard-h"><div><div class="t">${esc(x.name)}</div>
      <div class="chips">${x.holdDate?`<span class="tag">حجز ${dateAr(x.holdDate)}${a?' · منذ '+a:''}</span>`:'<span class="tag warn">تاريخ الحجز غير معروف</span>'}${x.verified?'':'<span class="tag warn">غير مؤكد</span>'}<span class="tag">${x.src==='bank'?'حساب الراجحي':'جهة أخرى'}</span></div></div>
      <div style="text-align:end"><div style="font-size:19px;font-weight:700">${amt(x.remaining)}<span class="cur" style="font-size:.6em">ر.س</span></div><div class="faint" style="font-size:11px">من ${amt(x.orig)}</div></div></div>
      <div class="bar"><i style="width:${pct}%;background:${x.remaining===0?'#2fd8a4':'linear-gradient(90deg,#e6c36a,#ffa35c)'}"></i></div>
      <div class="dcard-f"><span class="faint" style="font-size:11.5px">${x.remaining===0?'✓ تم السداد':'تم سداد '+Math.round(pct)+'%'}</span>
       <span><button class="btn sm" data-act="payDebt" data-id="${x.id}">سجّل حجز</button> <button class="x" data-act="editDebt" data-id="${x.id}" aria-label="تعديل" style="display:inline-grid">✎</button><button class="x" data-act="delDebt" data-id="${x.id}" aria-label="حذف" style="display:inline-grid">✕</button></span></div></div>`
  }).join('')
  const opts=d.debts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')
  return `<div class="sec-h"><h2>الديون</h2><button class="btn sm gold" data-act="addDebt">+ دين جديد</button></div>
  <div class="grid g2">
   <div class="card"><h3>الملخص</h3><div class="d-sum">${ring(paidPct,{size:112,c1:'#e6c36a',c2:'#ff7a6e',th:10,center:`<b>${Math.round(paidPct)}%</b><small>تم سداده</small>`})}
     <div class="stat"><div class="l">المتبقي</div><div class="v" style="font-size:24px">${amt(left)} ${CUR}</div>
     <div class="l" style="margin-top:9px">عدد الديون</div><div class="v" style="font-size:15px">${list.filter(x=>x.remaining>0).length} من ${list.length}${oldest?` · أقدم حجز منذ ${age(oldest.holdDate)}`:''}</div></div></div></div>
   <div class="card"><h3>مطابقة الأرقام ${Math.abs(diff)<1?'<span class="tag ok">متطابق</span>':'<span class="tag warn">يحتاج مراجعة</span>'}</h3>
     <div class="d-sum" style="gap:10px"><div class="stat"><div class="l">مجموع ديون الحساب عندي</div><div class="v" style="font-size:16px">${amt(bankSum)}</div></div>
     <div class="stat"><div class="l">الظاهر في الراجحي</div><div class="v" style="font-size:16px">${amt(s.bankDebt)}</div></div>
     <div class="stat"><div class="l">الفرق</div><div class="v ${Math.abs(diff)<1?'pos':'neg'}" style="font-size:16px">${amt(diff)}</div></div></div>
     <div class="note">${Math.abs(diff)<1?'الأرقام متطابقة.':'مجموع التفاصيل ما يطابق الرقم الظاهر في الراجحي. افتح كل دين وتأكد من مبلغه وتاريخه، أو حدّث «الظاهر في الراجحي» من الإعدادات.'}</div></div>
  </div>
  <div class="card" style="margin-bottom:14px"><h3>محاكي الحجز الشهري <span class="tag">سيناريو افتراضي</span></h3>
   <div class="sim-top"><div><div class="faint" style="font-size:11.5px">لو تسدّد شهرياً</div><div class="big2"><span id="simv">${amt(ui.simH)}</span>${CUR}</div></div>
    <div style="text-align:end"><div class="faint" style="font-size:11.5px">يبقى لك</div><div style="font-size:18px;font-weight:600" id="simleft">${amt(s.salary-ui.simH)}</div></div></div>

   <div id="sim-out">${simOut()}</div>
   <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn sm" data-act="simReset">ارجع للحجز التلقائي الفعلي</button></div>

  <div class="sec-h"><h2 style="font-size:17px">تفاصيل الديون</h2></div>
  <div class="grid g2">${dcards||'<div class="card empty">ما أضفت ديون</div>'}</div>
  <div class="card"><h3>سجل الحجز الفعلي ${unalloc.length?`<span class="tag warn">${unalloc.length} بدون نسبة لدين</span>`:''}<button class="btn sm" data-act="payDebt" data-id="">+ تسجيل</button></h3>
   ${pays.length?pays.slice(0,12).map(p=>{const v=verdict[p.id];return `<div class="row"><div class="ico" style="background:#ffa35c22">⬇️</div><div class="mid"><div class="t">${amt(p.amount)} ر.س</div>
     <div class="s">${fullDate(p.date)}${v==='est'?' · <span class="tag">تقديري — غيّره لما تعرف</span>':v===true?' · <span class="pos">✓ يطابق «'+MODE_S[s.order]+'»</span>':v===false?' · <span class="neg">≠ يخالف «'+MODE_S[s.order]+'»</span>':''}</div></div>
     <select class="pill-sel" data-bind="payDebt" data-id="${p.id}"><option value="">لم أعرف لأي دين</option>${d.debts.map(x=>`<option value="${x.id}" ${p.debtId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
     <button class="x" data-act="delPay" data-id="${p.id}" aria-label="حذف">✕</button></div>`}).join(''):'<div class="empty">لما ينحجز أول مبلغ من راتبك، سجّله هنا بتاريخه ومبلغه، وحدد لأي دين راح.<br>بهذا نعرف الترتيب الحقيقي بدل التخمين.</div>'}</div>`
}

function viewBudget(){
  const d=D(),ym=ui.ym,P=pace(d,ym),st=P.st
  const tgt=d.settings.investTarget||0
  const sumB=d.cats.reduce((a,c)=>a+(c.budget||0),0)+tgt,free=P.base-sumB
  const invPct=tgt?st.inv/tgt*100:(st.inv>0?100:0)
  const invRow=`<div class="env"><div class="env-h"><div class="ico" style="background:#6db7ff22">📈</div><div class="mid" style="flex:1"><div class="t" style="font-size:14px;font-weight:500">الاستثمار <span class="tag">هدف شهري</span></div><div class="s faint" style="font-size:11.5px">أضفت ${amt(st.inv)} ${tgt?'· '+(tgt-st.inv>0?'باقي '+amt(tgt-st.inv):'<span class="pos">تحقق الهدف ✓</span>'):'· حدد هدف'}</div></div><input class="env-in" inputmode="decimal" value="${tgt?mny(tgt).replace(/,/g,''):''}" placeholder="0" data-bind="investTarget"></div><div class="bar"><i style="width:${Math.min(100,invPct)}%;background:#6db7ff"></i></div></div>`
  const rows=d.cats.map(c=>{
    const sp=st.byCat[c.id]||0,bu=c.budget||0,pct=bu?sp/bu*100:(sp>0?100:0),col=pct>100?'#ff7a6e':pct>85?'#ffa35c':c.color
    return `<div class="env"><div class="env-h"><div class="ico" style="background:${c.color}22">${c.icon}</div>
      <div class="mid" style="flex:1"><div class="t" style="font-size:14px;font-weight:500">${c.name}</div>
      <div class="s faint" style="font-size:11.5px">صرفت ${amt(sp)} ${bu?'· '+(bu-sp>=0?'باقي '+amt(bu-sp):'<span class="neg">تجاوز '+amt(sp-bu)+'</span>'):'· حدد ميزانية'}</div></div>
      <input class="env-in" inputmode="decimal" value="${bu?mny(bu).replace(/,/g,''):''}" placeholder="0" data-bind="budget" data-id="${c.id}"></div>
      <div class="bar"><i style="width:${Math.min(100,pct)}%;background:${col}"></i></div></div>`}).join('')
  const usedPct=P.base>0?Math.min(100,sumB/P.base*100):0
  return `<div class="sec-h"><h2>الميزانية</h2>${monthNav()}</div>
  <div class="card hero" style="margin-bottom:14px"><div class="hero-row"><div class="hero-l"><div class="lbl">غير موزّع على الفئات</div>
    <div class="big ${free<0?'neg':''}">${amt(free)}${CUR}</div><div class="hero-sub">${free<0?'وزّعت أكثر من المتاح':free===0?'كل ريال له وظيفة ✓':'وزّعه على فئة أو اتركه كاحتياط'}</div></div>
    ${ring(usedPct,{size:104,c1:'#e6c36a',c2:'#2fd8a4',th:10,center:`<b>${Math.round(usedPct)}%</b><small>موزّع</small>`})}</div>
    <div class="kpis"><div class="kpi"><div class="k"><i style="background:#2fd8a4"></i>الدخل${P.expected?' (متوقع)':''}</div><div class="v">${amt(P.planned)}</div></div>
    <div class="kpi"><div class="k"><i style="background:#ffa35c"></i>محجوز للديون</div><div class="v">${amt(P.hold)}</div></div>
    <div class="kpi"><div class="k"><i style="background:#e6c36a"></i>المتاح للتوزيع</div><div class="v">${amt(P.base)}</div></div>
    <div class="kpi"><div class="k"><i style="background:#6db7ff"></i>الموزّع</div><div class="v">${amt(sumB)}</div></div></div></div>
  <div class="card"><h3>الأظرف الشهرية</h3>${rows}${invRow}<div class="note">طريقة الأظرف: وزّع المتاح كله على فئات قبل ما يبدأ الشهر، وكل ما صرفت ينقص من ظرفه. الهدف إن «غير الموزّع» يصير صفر.</div></div>`
}

function viewInvest(){

  const inv=list.reduce((a,x)=>a+x.invested,0),val=list.reduce((a,x)=>a+x.value,0),pl=val-inv,plp=inv?pl/inv*100:0

  const byKind={};list.forEach(x=>byKind[x.kind]=(byKind[x.kind]||0)+x.value)

function openForm({title,sub,fields,submit='حفظ',onSubmit}){
  const dlg=$('#dlg'),vals={}
  fields.forEach(f=>vals[f.name]=f.value??'')
  const optsOf=f=>typeof f.options==='function'?f.options(vals):f.options
  const setVal=(n,v)=>{vals[n]=v;const el=$('[data-f="'+n+'"]',dlg);if(el&&el.tagName!=='BUTTON')el.value=v}
  const submitNow=()=>{
    const r=onSubmit(vals)
    if(typeof r==='string'){const e=$('#ferr');e.textContent=r;e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
    else dlg.close()
  }
  function paint(){
    dlg.innerHTML=`<div class="dlg-t">${title}</div>${sub?`<div class="dlg-s">${sub}</div>`:'<div style="height:10px"></div>'}
     <form id="ff" novalidate>${fields.map(f=>{
      let h=''
      if(f.type==='seg')h=`<div class="seg">${optsOf(f).map(o=>`<button type="button" data-f="${f.name}" data-v="${o.v}" class="${vals[f.name]===o.v?'on':''}">${o.l}</button>`).join('')}</div>`
      else if(f.type==='chips')h=`<div class="cats">${optsOf(f).map(o=>`<button type="button" class="cat ${vals[f.name]===o.v?'on':''}" data-f="${f.name}" data-v="${o.v}" style="${vals[f.name]===o.v?`border-color:${o.c};background:${o.c}26`:''}">${o.l}</button>`).join('')}</div>`
      else if(f.type==='select')h=`<select class="inp" data-f="${f.name}">${optsOf(f).map(o=>`<option value="${o.v}" ${vals[f.name]===o.v?'selected':''}>${o.l}</option>`).join('')}</select>`
      else if(f.type==='money')h=`<input class="inp money" inputmode="decimal" autocomplete="off" data-f="${f.name}" value="${esc(vals[f.name])}" placeholder="0">`
      else if(f.type==='dec')h=`<input class="inp" inputmode="decimal" autocomplete="off" data-f="${f.name}" value="${esc(vals[f.name])}" placeholder="${esc(f.ph||'0')}" style="direction:ltr;text-align:end">`
      else h=`<input class="inp" type="${f.type||'text'}" autocomplete="off" data-f="${f.name}" value="${esc(vals[f.name])}" placeholder="${esc(f.ph||'')}">`
      return `<div class="fld"><label>${f.label}</label>${h}${f.hint?`<div class="faint" style="font-size:11px;margin-top:5px">${f.hint}</div>`:''}</div>`}).join('')}
     <div class="dlg-foot"><div class="err" id="ferr" role="alert"></div>
      <div class="dlg-a"><button type="button" class="btn" id="fcancel">إلغاء</button><button type="submit" class="btn pri">${submit}</button></div></div></form>`
    $('#fcancel').onclick=()=>dlg.close()
    $('#ff').onsubmit=e=>{e.preventDefault();submitNow()}
    const ins=$$('input[data-f]:not([type=date])',dlg)
    ins.forEach((el,i)=>el.setAttribute('enterkeyhint',i<ins.length-1?'next':'done'))
    $$('[data-f]',dlg).forEach(el=>{
      const f=fields.find(x=>x.name===el.dataset.f)
      if(el.tagName==='BUTTON'){el.onclick=()=>{vals[f.name]=el.dataset.v;if(f.onChange)f.onChange(vals);paint()}}
      else{
        el.oninput=()=>{vals[f.name]=el.value;if(f.onInput)f.onInput(vals,setVal)}
        if(el.tagName==='INPUT'&&el.type!=='date')el.onkeydown=e=>{
          if(e.key!=='Enter')return;e.preventDefault()
          const i=ins.indexOf(el);if(i>=0&&i<ins.length-1)ins[i+1].focus();else submitNow()}
      }
    })
  }
  paint();if(dlg.open)dlg.close();dlg.showModal()
}
const done=m=>toast(demoOn?m+' (مؤقت — وضع المعاينة)':m)
const fmtIn=h=>mny(h).replace(/,/g,'')
function askConfirm(msg,yes,label='حذف'){
  const c=$('#cfm')
  c.innerHTML=`<div class="dlg-t" style="font-size:17px;line-height:1.7">${msg}</div><div class="dlg-a"><button class="btn" id="cn">إلغاء</button><button class="btn" id="cy" style="background:linear-gradient(135deg,#ff8d82,#e2574c);color:#1b0503;border:none">${label}</button></div>`
  $('#cn').onclick=()=>c.close();$('#cy').onclick=()=>{c.close();yes()}

function allocateEst(d,amount,mode){
  const out=[];let left=amount
  for(const x of orderDebts(debtList(d),mode)){if(left<=0)break;const a=Math.min(left,x.remaining);if(a>0){out.push({debtId:x.id,amount:a});left-=a}}
  if(left>0)out.push({debtId:'',amount:left})
  return out
}
function formSalary(){
  const d=D(),s=d.settings
  const linkNet=(v,set)=>{const a=parseMoney(v.salary),h=parseMoney(v.hold);if(isFinite(a)&&isFinite(h))set('net',fmtIn(Math.max(0,a-h)))}
  openForm({title:'تسجيل راتب الشهر',sub:'اكتب الراتب، وكم يبقى لك بعد الحجز <b>أو</b> كم انحجز — أي واحد يحدّث الثاني تلقائياً.',fields:[
    {name:'salary',label:'الراتب (ر.س)',type:'money',value:fmtIn(s.salary),onInput:linkNet},
    {name:'net',label:'يبقى لك بعد الحجز (ر.س)',type:'money',value:fmtIn(Math.max(0,s.salary-s.hold)),onInput:(v,set)=>{const a=parseMoney(v.salary),n=parseMoney(v.net);if(isFinite(a)&&isFinite(n))set('hold',fmtIn(Math.max(0,a-n)))}},
    {name:'hold',label:'ينحجز للديون (ر.س)',type:'money',value:fmtIn(s.hold),onInput:linkNet},
    {name:'date',label:'تاريخ نزول الراتب',type:'date',value:todayStr()}
  ],submit:'تم',onSubmit:v=>{
    const sal=parseMoney(v.salary),h=String(v.hold).trim()===''?0:parseMoney(v.hold),date=v.date||todayStr()
    if(!(sal>0))return 'اكتب مبلغ الراتب'
    if(!(h>=0))return 'مبلغ المحجوز غير صحيح'
    if(h>sal)return 'المحجوز أكبر من الراتب!'
    if(d.tx.some(t=>t.type==='income'&&t.cat==='salary'&&t.amount===sal&&ymOf(t.date)===ymOf(date)))return 'هذا الراتب مسجّل قبل في نفس الشهر (احذفه من المعاملات لو تبي تعيده)'
    d.tx.push({id:uid(),type:'income',cat:'salary',amount:sal,date,note:'الراتب'})
    if(h>0)allocateEst(d,h,s.order||'newest').forEach(a=>d.payments.push({id:uid(),debtId:a.debtId,amount:a.amount,date,est:true}))
    s.salary=sal;s.hold=h;s.holdSet=true
    persist();ui.ym=ymOf(date);render();done('تم تسجيل الراتب ✓')
  }})
}
const GUIDE=`<div class="dlg-t">دليل الاستخدام</div><div class="guide">
<p class="lead">الفكرة: راتبك ينزل، جزء صغير منه ينحجز تلقائياً للديون، والباقي هو اللي تعيش عليه. التطبيق يجاوب على أربعة أسئلة: <b>كم نزل؟ كم انحجز؟ كم صرفت؟ وكم باقي من الديون ومتى تخلص؟</b></p>
<h4>روتينك كل شهر (5 دقايق)</h4>
<ol>
<li><b>يوم ينزل الراتب:</b> من «نظرة عامة» اضغط <b>سجّل الراتب</b>. اكتب الراتب و«يبقى لك»، والمحجوز يتحسب لحاله (أو العكس). اضغط <b>تم</b>.</li>
<li><b>طول الشهر:</b> كل ما صرفت شي اضغط <b>+</b> في الشريط السفلي ← مصروف ← المبلغ ← الفئة ← حفظ.</li>
<li><b>بعد الراتب:</b> افتح <b>الديون</b> وشوف لأي دين راح الحجز. التطبيق يوزّعه «تقديرياً» على <b>الأحدث حجزاً أولاً</b> (حسب ملاحظتك). لما تعرف الدين الحقيقي غيّره من القائمة جنب المبلغ.</li>
<li><b>مرة بالأسبوع:</b> افتح <b>الاستثمار</b> واضغط «تحديث الأسعار».</li>
<li><b>آخر الشهر:</b> افتح <b>الميزانية</b> وعدّل المبالغ للشهر الجاي.</li>
</ol>
<h4>كل تبويب</h4>
<p><b>نظرة عامة:</b> الرقم الكبير هو المتبقي من الشهر (الدخل − المحجوز − المصروف − الاستثمار). الحلقة تبيّن كم استهلكت من المتاح: أخضر مرتاح، برتقالي قربت، أحمر تجاوزت. تحتها توزيع المصروف ومخطط التراكم وأعمدة 6 أشهر. الأيام والأشهر تمشي من اليمين لليسار مثل القراءة العربية.</p>
<p><b>الديون:</b> بطاقة لكل دين (المتبقي، تاريخ الحجز، نسبة السداد). <b>مطابقة الأرقام</b> تقارن مجموع ديونك بالرقم الظاهر في الراجحي. <b>المحاكي</b> سيناريو فقط: اختر الترتيب (الأحدث/الأقدم/الأصغر/الأكبر) وحرّك المؤشر لتشوف كم تاخذ الديون لو سدّدت زيادة. <b>سجل الحجز الفعلي</b> فيه كل مبلغ انحجز، وعلامة «تقديري» يعني التطبيق خمّن الدين.</p>
<p><b>المعاملات:</b> كل الدخل والمصروف بالأيام، وتفلتر بالفئة. الحذف بزر ✕.</p>
<p><b>الميزانية:</b> وزّع المتاح على الفئات، وفيه ظرف <b>الاستثمار</b> كهدف شهري. الهدف إن «غير الموزّع» يوصل صفر.</p>
<p><b>الاستثمار:</b> أضف مركزاً (سهم، ذهب، صندوق…) بالكمية وسعر الوحدة، فتنحسب القيمة والربح أو الخسارة (٪ وبالريال) لحالها. «تحديث الأسعار» تكتب فيها السعر الجديد لكل مركز، ويتكوّن مخطط الأداء مع الأيام. «جلب الأسعار (تجريبي)» يسحب سعر الأسهم تلقائياً لو حطيت مفتاح Sahmk في ⚙ ورمز السهم. <b>حاسبة النمو</b> سيناريو لأثر الإيداع المنتظم وليست توقعاً. <b>نصيحة اليوم</b> تتغير كل يوم، وهي معلومات عامة مو توصية.</p>
<h4>الجامعة والمالية في موقع واحد</h4>
<p>من الشريط اللي فوق تنتقل بين <b>الجامعة</b> و<b>المالية</b>. تسجّل دخول مرة وحدة وتتزامن الأقسام كلها بين جوالك ولابتوبك، وكل قسم محفوظ في مكان مستقل بنفس القاعدة.</p>

<h4>مهم تعرفه</h4>
<ul>
<li>شارة <b>● متزامن</b> يعني بياناتك على السيرفر. لو شفت «بدون اتصال» تنحفظ عندك وتتزامن لما يرجع الإنترنت.</li>
<li>زر <b>+</b> يتغير حسب التبويب: معاملة جديدة، أو تسجيل حجز في الديون، أو مركز جديد في الاستثمار.</li>
<li>التطبيق للتتبع والحساب، وما هو استشارة مالية أو قانونية أو استثمارية.</li>
</ul></div>

async function fetchQuotes(){ // تجريبي: Sahmk (الخطة المجانية: رمز واحد لكل طلب) — يحتاج مفتاح API من الإعدادات
  const d=D(),key=(d.settings.apiKey||'').trim(),targets=d.invest.filter(x=>x.symbol&&x.units>0)
  if(!key){toast('ضع مفتاح Sahmk في ⚙ الإعدادات أولاً');return}
  if(!targets.length){toast('أضف رمز السهم والكمية لمركز واحد على الأقل');return}
  let ok=0,fail=0,msg=''
  toast('جاري جلب الأسعار…')
  for(const x of targets){
    try{
      const r=await fetch('https://api.sahmk.sa/api/v1/quote/'+encodeURIComponent(x.symbol)+'/',{headers:{'X-API-Key':key}})
      if(!r.ok)throw new Error('HTTP '+r.status)
      const j=await r.json(),pr=Number(j.price??j.last_price)
      if(!(pr>0))throw new Error('شكل الرد غير متوقع')
      x.price=pr;x.value=Math.round(x.units*pr*100);snapVH(x,todayStr());ok++
    }catch(e){fail++;msg=String(e&&e.message||e)}
  }
  persist();render()
  toast(ok?'تم تحديث '+ok+' من '+targets.length+(fail?' — فشل '+fail:''):'تعذّر الجلب: '+(/fetch|network/i.test(msg)?'المتصفح منع الطلب أو ما في اتصال':msg))
}

const COLS=[['tx','fin_tx'],['payments','fin_pay'],['debts','fin_debt'],['invest','fin_inv']]
const SYNC_TIMEOUT_MS=10000
const SYNC={authReady:false,fs:null,au:null,auth:null,db:null,uid:null,ready:false,last:{},unsubs:[],first:{}}
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])):v)
const mapOf=arr=>Object.fromEntries(arr.map(x=>[x.id,canon(x)]))
const metaStr=()=>canon({settings:REAL.settings,cats:REAL.cats})
const sameMap=(a,b)=>{const ka=Object.keys(a),kb=Object.keys(b);return ka.length===kb.length&&ka.every(k=>a[k]===b[k])}
const colRef=c=>SYNC.fs.collection(SYNC.db,'users',SYNC.uid,c)

function setSyncStatus(kind,detail){
  const chip=$('#sync-chip')
  const map={
    off:['المزامنة: غير مفعّلة','',''],
    syncing:['↻ جارٍ المزامنة…','warn',''],
    ok:['● متزامن','ok',''],
    offline:['○ بدون اتصال — يتزامن لاحقاً','warn',''],
    needhttps:['⚠ افتح من رابط الموقع (https) عشان تتزامن','warn',''],
    error:['⚠ '+(detail||'خطأ مزامنة'),'err',detail||'']
  }
  const m=map[kind];chip.textContent=m[0];chip.className='sync-chip '+m[1];chip.title=m[2]
}
function errText(e){
  const code=(e&&e.code)||''
  if(code==='permission-denied')return 'رُفضت الصلاحيات: أضف قاعدة users/{uid}/{document=**} في Rules'
  if(code==='not-found'||code==='failed-precondition')return code+': أنشئ قاعدة Firestore من الكونسول'
  return code||String(e&&e.message||e)
}
function pushChanges(){
  if(!SYNC.ready)return
  const fs=SYNC.fs,fail=e=>setSyncStatus('error',errText(e))
  for(const [key,col] of COLS){
    const cur=mapOf(REAL[key]),last=SYNC.last[key]||{}
    for(const id in cur)if(cur[id]!==last[id])fs.setDoc(docRef(col,id),JSON.parse(cur[id])).catch(fail)
    for(const id in last)if(!(id in cur))fs.deleteDoc(docRef(col,id)).catch(fail)
    SYNC.last[key]=cur
  }
  const ms=metaStr()
  if(ms!==SYNC.last.meta){fs.setDoc(docRef('fin_meta','main'),JSON.parse(ms)).catch(fail);SYNC.last.meta=ms}
}
window.__finPush=pushChanges

function applyMeta(m){
  if(m.settings)REAL.settings=Object.assign({},REAL.settings,m.settings)
  if(Array.isArray(m.cats)){
    const have=new Map(m.cats.map(c=>[c.id,c]))
    REAL.cats=CAT_DEFAULTS.map(c=>have.get(c.id)||{...c,budget:0}).concat(m.cats.filter(c=>!CAT_DEFAULTS.some(q=>q.id===c.id)))
  }
}
function tryFirst(){
  if([...COLS.map(c=>c[0]),'meta'].every(k=>k in SYNC.first))firstSync()
}
function firstSync(){
  const flag='fin_sync_init_'+SYNC.uid,R=SYNC.first
  const remoteEmpty=COLS.every(([k])=>!R[k].length)&&!R.meta
  if(remoteEmpty){
    // السيرفر فاضي: نرفع كل اللي عندنا
    COLS.forEach(([k])=>SYNC.last[k]={});SYNC.last.meta='';SYNC.ready=true;pushChanges()
  }else if(!localStorage.getItem(flag)){
    // أول مرة لهذا الجهاز: ندمج حسب المعرّف (السيرفر يفوز لو نفس المعرّف) بدون ما نخسر شي محلي
    COLS.forEach(([k])=>{const m=new Map(REAL[k].map(x=>[x.id,x]));R[k].forEach(x=>m.set(x.id,x));REAL[k]=[...m.values()]})
    if(R.meta)applyMeta(R.meta)
    COLS.forEach(([k])=>SYNC.last[k]=mapOf(R[k]));SYNC.last.meta=R.meta?metaStr():''
    SYNC.ready=true;pushChanges();saveLocal();render()
  }else{
    // جهاز معروف: السيرفر هو المرجع
    COLS.forEach(([k])=>REAL[k]=R[k]);if(R.meta)applyMeta(R.meta)
    COLS.forEach(([k])=>SYNC.last[k]=mapOf(R[k]));SYNC.last.meta=metaStr()
    SYNC.ready=true;saveLocal();render()
  }
  try{localStorage.setItem(flag,'1')}catch(e){}
}
function statusFrom(m){
  if(!navigator.onLine||m.fromCache)setSyncStatus('offline')
  else if(m.hasPendingWrites)setSyncStatus('syncing')
  else setSyncStatus('ok')
}
function onColSnap(key,snap){
  const arr=snap.docs.map(d=>d.data())
  if(!SYNC.ready){SYNC.first[key]=arr;tryFirst()}
  else{
    const rem=mapOf(arr)
    if(!sameMap(mapOf(REAL[key]),rem)){REAL[key]=arr;saveLocal();render()}
    SYNC.last[key]=rem
  }
  statusFrom(snap.metadata)
}
function onMetaSnap(snap){
  const m=snap.exists()?snap.data():null
  if(!SYNC.ready){SYNC.first.meta=m;tryFirst()}
  else if(m){
    const before=metaStr();applyMeta(m);const after=metaStr()
    if(before!==after){saveLocal();render()}
    SYNC.last.meta=after
  }
  statusFrom(snap.metadata)
}
function startSync(user){
  stopSync();SYNC.uid=user.uid;SYNC.first={};setSyncStatus('syncing')
  const fail=e=>setSyncStatus('error',errText(e)),o={includeMetadataChanges:true}
  COLS.forEach(([key,col])=>SYNC.unsubs.push(SYNC.fs.onSnapshot(colRef(col),o,snap=>onColSnap(key,snap),fail)))
  SYNC.unsubs.push(SYNC.fs.onSnapshot(docRef('fin_meta','main'),o,onMetaSnap,fail))
  updateAuthBtn(user)
}
function stopSync(){SYNC.unsubs.forEach(u=>u());SYNC.unsubs=[];SYNC.ready=false;SYNC.last={};SYNC.first={}}

  wireLogin()
  const proto=location.protocol,weird=!(proto==='http:'||proto==='https:'||proto==='file:')
  if(weird)setSyncStatus('needhttps')
  const watchdog=setTimeout(()=>{if(!SYNC.authReady)setSyncStatus(weird?'needhttps':'error','ما استجاب Firebase خلال 10 ثواني. تأكد من الإنترنت وافتح الصفحة من رابط https')},SYNC_TIMEOUT_MS)
  try{
    const base='https://www.gstatic.com/firebasejs/'+FB_VERSION+'/'
    const [appM,authM,fsM]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')])
    const app=appM.initializeApp(FIREBASE_CONFIG);SYNC.auth=authM.getAuth(app)
    try{SYNC.db=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})})}
    catch(e){SYNC.db=fsM.getFirestore(app)}
    SYNC.fs=fsM;SYNC.au=authM
    authM.onAuthStateChanged(SYNC.auth,user=>{
      SYNC.authReady=true;clearTimeout(watchdog)
      if(user)startSync(user);else{stopSync();setSyncStatus('off');updateAuthBtn(null)}
    })
  }catch(e){clearTimeout(watchdog);setSyncStatus('error','تعذّر تحميل Firebase، تأكد من الإنترنت (التطبيق يشتغل محلياً)')}
}

render(false)
initSync()
</script>
