<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0a09">
<title>التمارين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a09; --surface:#17110e; --line:rgba(255,255,255,.075);
  --text:#f5ede8; --muted:#a89a90; --faint:#7f716a;
  --emerald:#ff7a3d; --gold:#e6c36a; --coral:#ff7a6e; --sky:#6db7ff; --amber:#ffa35c;
  --radius:20px;
  --font:'IBM Plex Sans Arabic','Noto Sans Arabic','Segoe UI',system-ui,Tahoma,sans-serif;
  --display:'Reem Kufi','IBM Plex Sans Arabic','Noto Kufi Arabic','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{
  font-family:var(--font);color:var(--text);line-height:1.55;min-height:100vh;
  background:
    radial-gradient(1100px 560px at 88% -8%,rgba(255,122,61,.11),transparent 60%),
    radial-gradient(900px 520px at -5% 18%,rgba(230,195,106,.07),transparent 55%),
    var(--bg);
  background-attachment:fixed;
  padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;color:inherit}
.app{max-width:1120px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.cur{font-size:.42em;color:var(--gold);margin-inline-start:6px;font-weight:600;letter-spacing:0}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.pos{color:var(--emerald)} .neg{color:var(--coral)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:23px;color:#1a1405;flex-shrink:0;
  background:linear-gradient(135deg,#f6dd92,#c99a3a);box-shadow:0 6px 22px rgba(230,195,106,.28)}
.brand-t{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.1}
.brand-s{font-size:11.5px;color:var(--muted)}
.top-actions{display:flex;gap:8px;align-items:center}
.chip-btn{font-size:11.5px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);transition:.2s;white-space:nowrap}
.chip-btn.on{background:rgba(230,195,106,.12);border-color:rgba(230,195,106,.45);color:var(--gold)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;flex-shrink:0}
.icon-btn svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.banner{display:none;margin-bottom:14px;padding:11px 14px;border-radius:14px;font-size:12.5px;line-height:1.7;color:#f1dca0;
  background:linear-gradient(90deg,rgba(230,195,106,.14),rgba(230,195,106,.05));border:1px solid rgba(230,195,106,.3)}
.banner.on{display:block}
.banner button{color:var(--gold);text-decoration:underline;font-size:12.5px;padding:0 4px}

/* ---------- tabs ---------- */
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(13,10,9,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--faint);padding:6px 0;border-radius:12px;transition:color .2s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.tab.on{color:var(--emerald)}
.tab.on svg{filter:drop-shadow(0 0 7px rgba(255,122,61,.55))}

/* ---------- layout ---------- */
.grid{display:grid;gap:14px;margin-bottom:14px}
.card{position:relative;border-radius:var(--radius);padding:18px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.016))}
.card>h3,.card-h{font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:10px;font-weight:600;padding:2px 9px;border-radius:99px;background:rgba(230,195,106,.14);color:var(--gold);border:1px solid rgba(230,195,106,.3)}
.tag.warn{background:rgba(255,122,110,.12);color:var(--coral);border-color:rgba(255,122,110,.3)}
.tag.ok{background:rgba(255,122,61,.12);color:var(--emerald);border-color:rgba(255,122,61,.3)}
.link{font-size:12px;color:var(--emerald)}
.empty{text-align:center;color:var(--faint);padding:26px 10px;font-size:13px;line-height:1.8}
.note{font-size:11.5px;color:var(--faint);line-height:1.8;margin-top:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-size:20px;font-weight:600}
.mnav{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;padding:3px}
.mnav button{width:32px;height:32px;border-radius:99px;font-size:18px;color:var(--muted);display:grid;place-items:center}
.mnav button:active{background:rgba(255,255,255,.08)}
.mnav span{font-size:13px;font-weight:600;min-width:104px;text-align:center}

/* ---------- hero ---------- */
.hero{overflow:hidden;padding:22px 20px;border:1px solid rgba(255,122,61,.2);
  background:radial-gradient(520px 240px at 92% 0%,rgba(255,122,61,.24),transparent 62%),linear-gradient(135deg,#4a2210,#2c150b 55%,#1f100a)}
.hero::before{content:"";position:absolute;inset-inline:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(230,195,106,.8),transparent)}
.hero-row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.hero-l{min-width:0}
.lbl{font-size:12px;color:rgba(236,245,240,.65)}
.big{font-family:var(--display);font-size:clamp(34px,9.5vw,54px);font-weight:700;letter-spacing:-.5px;line-height:1.12;margin:2px 0 4px}
.hero-sub{font-size:12.5px;color:rgba(236,245,240,.72)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}
.kpi{background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 13px}
.kpi .k{font-size:11px;color:rgba(236,245,240,.6);display:flex;align-items:center;gap:6px}
.kpi .k i{width:7px;height:7px;border-radius:50%;display:inline-block}
.kpi .v{font-size:17px;font-weight:600;margin-top:2px}
.callout{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;padding:14px 16px;border-radius:16px;
  background:linear-gradient(90deg,rgba(255,163,92,.14),rgba(255,163,92,.04));border:1px solid rgba(255,163,92,.32);font-size:13px;line-height:1.7}
.callout b{color:var(--amber)}

/* ---------- rings / donut ---------- */
.ring{position:relative;flex-shrink:0}
.ring svg,.donut svg{width:100%;height:100%;display:block}
.ring-c,.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.25}
.ring-c b{font-family:var(--display);font-size:24px}
.ring-c small{font-size:10.5px;color:var(--muted)}
.arc,.dseg{animation:arc 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes arc{from{stroke-dasharray:0 100}}
.donut{position:relative;width:176px;height:176px;flex-shrink:0}
.donut-c b{font-family:var(--display);font-size:20px}
.donut-c small{font-size:10.5px;color:var(--muted)}
.dn-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.legend{flex:1;min-width:170px;display:flex;flex-direction:column;gap:9px}
.lg{display:flex;align-items:center;gap:9px;font-size:12.5px}
.lg i{width:10px;height:10px;border-radius:4px;flex-shrink:0}
.lg .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .p{color:var(--faint);font-size:11px;width:34px;text-align:start}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);fill:var(--faint);font-size:11px}
.leg-inline{display:flex;gap:14px;font-size:11px;color:var(--muted);font-weight:400}
.leg-inline i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}

/* ---------- bars / lists ---------- */
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.row .mid{flex:1;min-width:0}
.row .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:11.5px;color:var(--faint)}
.row .a{font-size:15px;font-weight:600;text-align:end;white-space:nowrap}
.x{width:28px;height:28px;border-radius:9px;color:var(--faint);font-size:14px;display:grid;place-items:center;flex-shrink:0}
.x:hover,.x:active{background:rgba(255,122,110,.14);color:var(--coral)}
.day-h{font-size:11.5px;color:var(--faint);margin:14px 2px 2px;font-weight:600}
.day-h:first-child{margin-top:0}

/* ---------- debts ---------- */
.d-sum{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.stat{flex:1;min-width:120px}
.stat .l{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:19px;font-weight:600;margin-top:1px}
.tl{display:flex;height:38px;border-radius:12px;overflow:hidden;gap:2px;margin:14px 0 10px}
.tl>div{min-width:6px;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#1a1208;overflow:hidden;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;direction:ltr}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--emerald),var(--gold))}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--emerald),var(--gold))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-9px;border:4px solid var(--emerald);box-shadow:0 2px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--emerald)}
.sim-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.big2{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
.seg{display:flex;background:rgba(255,255,255,.05);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:12.5px;color:var(--muted);transition:.2s}
.seg button.on{background:var(--emerald);color:#1a0a02;font-weight:600}
.btn{padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:.2s}
.btn.pri{background:linear-gradient(135deg,#ff9a5c,#e2551d);color:#1a0a02;border:none}
.btn.gold{background:rgba(230,195,106,.14);border-color:rgba(230,195,106,.4);color:var(--gold)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn:active{transform:scale(.97)}
.dcard{padding:16px}
.dcard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.dcard-h .t{font-weight:600;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.dcard-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.pill-sel{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:12px;max-width:150px}
.pill-sel option{background:#17110e}

/* ---------- budget ---------- */
.env{padding:14px 0;border-bottom:1px solid var(--line)}
.env:last-child{border-bottom:none}
.env-h{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.env-in{width:96px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:end;font-size:14px;direction:ltr}
.env-in:focus{outline:none;border-color:var(--emerald)}

/* ---------- fab / dialog / toast ---------- */
.spark{width:92px;height:26px;flex-shrink:0}
.pos-sum{display:flex;align-items:center;gap:10px;flex:1 1 100%;font-size:11.5px;padding-top:8px}
.badge-pl.zero{background:rgba(255,255,255,.07);color:var(--muted)}
.pos-act{display:flex;gap:7px;flex-wrap:wrap;padding:0 0 12px;border-bottom:1px solid var(--line);margin-top:-2px}
.pos-act:last-child{border-bottom:none}
.badge-pl{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px}
.badge-pl.up{background:rgba(255,122,61,.14);color:var(--emerald)}.badge-pl.dn{background:rgba(255,122,110,.14);color:var(--coral)}
.gc-res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.gc-res>div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px;padding:9px 10px}
.gc-res>div>span:first-child{display:block;font-size:10.5px;color:var(--muted);line-height:1.4}.gc-res b{font-size:15px;color:var(--text)}
.rng{margin:2px 0 8px}.rng-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.rng-h b{color:var(--text)}
.tip-t{font-size:15.5px;line-height:1.9;margin:2px 0 12px}
.tip-f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.obs{font-size:13px;line-height:1.8;color:#e6d9d1;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:8px}
.site-nav{display:flex;gap:4px;max-width:560px;margin:0 auto 14px;padding:4px;border-radius:16px;background:rgba(16,11,9,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:45}
.site-nav a{flex:1;text-align:center;font-size:13px;font-weight:600;padding:9px 10px;border-radius:12px;color:var(--muted);text-decoration:none;transition:.2s}
.site-nav a.on{background:linear-gradient(135deg,rgba(255,122,61,.2),rgba(255,122,61,.08));color:var(--emerald);box-shadow:inset 0 0 0 1px rgba(255,122,61,.3)}
.subbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px}
.sync-chip{font-size:11px;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);line-height:1.5}
.sync-chip.ok{background:rgba(255,122,61,.12);border-color:rgba(255,122,61,.35);color:var(--emerald)}
.sync-chip.warn{background:rgba(255,163,92,.12);border-color:rgba(255,163,92,.35);color:#ffc58f}
.sync-chip.err{background:rgba(255,122,110,.12);border-color:rgba(255,122,110,.35);color:var(--coral)}
.tab.add{flex:0 0 76px;color:var(--muted)}
.tab.add .plus{width:56px;height:56px;border-radius:20px;margin-top:-32px;background:linear-gradient(135deg,#ff9a5c,#e2551d);
  box-shadow:0 10px 28px rgba(255,122,61,.42),0 0 0 5px rgba(13,10,9,.92);display:grid;place-items:center;transition:transform .15s}
.tab.add:active .plus{transform:scale(.92)}
.tab.add .plus svg{width:26px;height:26px;stroke:#1a0a02;stroke-width:2.6;filter:none}
dialog{margin:auto auto 0;width:min(460px,100vw);max-height:92vh;max-height:calc(100dvh - 10px);overflow:auto;border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;
  background:#15100e;color:var(--text);padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));direction:rtl}
dialog::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
dialog[open]{animation:sheet .28s cubic-bezier(.2,.9,.3,1)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
.dlg-t{font-family:var(--display);font-size:20px;font-weight:600;margin-bottom:4px}
.dlg-s{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.7}
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;padding:13px 14px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:15px}
.inp:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(255,122,61,.14)}
.inp.money{font-size:24px;font-weight:600;direction:ltr;text-align:end;font-family:var(--display)}
select.inp option{background:#17110e}
.cats{display:flex;flex-wrap:wrap;gap:7px}
.cat{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12.5px;display:flex;align-items:center;gap:6px;transition:.15s}
.cat.on{font-weight:600}
.dlg-a{display:flex;gap:10px;margin-top:18px}
.dlg-foot{position:sticky;bottom:-20px;margin:6px -18px -20px;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(12,26,22,0),#15100e 28%)}
.dlg-foot .dlg-a{margin-top:0}.dlg-foot .err{margin:0 0 8px;min-height:0}
.err.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(6px)}40%,80%{transform:translateX(-6px)}}
.guide{font-size:13.5px;line-height:1.85;color:#e6d9d1}
.guide h4{font-family:var(--display);font-size:16px;color:var(--gold);margin:16px 0 4px;font-weight:600}
.guide p{margin-bottom:9px}.guide .lead{font-size:14px;color:var(--text)}
.guide ol,.guide ul{padding-inline-start:20px;margin-bottom:8px}.guide li{margin-bottom:7px}
.guide b{color:var(--text)}
.dlg-a .btn{flex:1;padding:14px}
.err{color:var(--coral);font-size:12px;margin-top:8px;min-height:16px}
.toast{position:fixed;inset-inline:0;bottom:calc(150px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;z-index:60;
  background:#3a1c0f;border:1px solid rgba(255,122,61,.4);padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transform:translateY(10px);transition:.3s}
.toast.on{opacity:1;transform:none}

@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){
  body{padding-bottom:50px}
  .tabs{position:sticky;top:10px;inset-inline:auto;bottom:auto;max-width:600px;margin:0 auto 18px;border:1px solid var(--line);border-radius:18px;padding:6px}
  .tab{flex-direction:row;justify-content:center;gap:8px;font-size:13px;padding:10px 6px}
  .tab.on{background:rgba(255,122,61,.1)}
  .g2{grid-template-columns:1fr 1fr}
  .g-hero{grid-template-columns:1.55fr 1fr}
  .tab.add{flex:0 0 auto;flex-direction:row;padding:8px 16px;color:var(--emerald)}
  .tab.add .plus{width:30px;height:30px;border-radius:10px;margin-top:0;box-shadow:none}
  .tab.add .plus svg{width:17px;height:17px}
  .toast{bottom:40px}
  dialog{margin:auto;border-radius:26px;border-bottom:1px solid var(--line)}
}
@media print{.tabs,.top-actions,.site-nav{display:none!important}}

/* ===== بوابة تسجيل الدخول (تغطي الصفحة كلها لين تدخل) ===== */
.gate{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:20px;background:var(--g-bg);color:var(--g-text);font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;direction:rtl;overflow:auto}
.gate[hidden]{display:none}
.gate.t-dark{--g-bg:radial-gradient(900px 500px at 85% -10%,rgba(255,122,61,.14),transparent 60%),#0d0a09;--g-text:#f5ede8;--g-muted:#a89a90;--g-line:rgba(255,255,255,.14);--g-input:rgba(255,255,255,.05);--g-accent:#ff7a3d;--g-on:#1a0a02;--g-ring:rgba(255,122,61,.2);--g-err:#ff8d82}

.gate-box{width:min(380px,100%);text-align:center}
.gate-logo{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:30px;margin:0 auto 14px;font-weight:700}
.gate-title{font-size:23px;font-weight:800;margin-bottom:4px}
.gate-sub{font-size:13px;color:var(--g-muted);margin-bottom:18px;min-height:20px;line-height:1.7}
.gate form{text-align:right}
.gate label{display:block;font-size:12px;color:var(--g-muted);margin:0 0 5px}
.gate input{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--g-line);background:var(--g-input);color:var(--g-text);font:inherit;font-size:16px;margin-bottom:12px;direction:ltr;text-align:left}
.gate input:focus{outline:none;border-color:var(--g-accent);box-shadow:0 0 0 3px var(--g-ring)}
.gate .gate-btn{width:100%;padding:14px;border:none;border-radius:13px;background:var(--g-accent);color:var(--g-on);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.gate .gate-btn:disabled{opacity:.6}
.gate .gate-link{background:none;border:none;color:var(--g-muted);font:inherit;font-size:12.5px;text-decoration:underline;margin-top:14px;cursor:pointer}
.gate-msg{min-height:18px;font-size:12.5px;color:var(--g-err);margin:0 0 8px;line-height:1.7}
.gate-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--g-line);border-top-color:var(--g-accent);margin:0 auto 12px;animation:gspin .8s linear infinite}

@keyframes gspin{to{transform:rotate(360deg)}}

<script>
var GATE=(function(){
  var el=document.getElementById('gate'),locked=false,inerted=[];
  function $(i){return document.getElementById(i)}
  function lock(){
    if(locked)return;locked=true;
    document.querySelectorAll('dialog[open]').forEach(function(d){try{d.close()}catch(e){}});
    Array.prototype.forEach.call(document.body.children,function(c){
      if(c===el||c.tagName==='SCRIPT'||c.hasAttribute('inert'))return;
      c.setAttribute('inert','');inerted.push(c)});
    el.hidden=false;
  }
  function unlock(){inerted.forEach(function(c){c.removeAttribute('inert')});inerted=[];locked=false;el.hidden=true}
  function state(sub,spin,form,retry){$('gate-sub').textContent=sub;$('gate-spin').hidden=!spin;$('gate-form').hidden=!form;$('gate-retry').hidden=!retry}
  return{
    lock:lock,unlock:unlock,
    checking:function(){lock();state('جاري التحقق…',true,false,false)},
    form:function(){lock();state('ادخل بحسابك عشان تفتح الموقع',false,true,false);var e=$('gate-email');setTimeout(function(){try{e.focus()}catch(x){}},60)},
    error:function(msg){lock();state(msg,false,false,true)}
  };
})();
document.getElementById('gate-reload').onclick=function(){location.reload()};
</script>

function planWeek(settings,dateStr){
  const s0=dnOf(weekStart(settings.startDate)),dn=dnOf(dateStr),wk=Math.floor((dn-s0)/7),idx=((wk%8)+8)%8

function setsFor(e,ph){
  if(ph.mode==='ramp')return Math.max(2,e.sets-1)
  if(ph.mode==='deload')return Math.max(2,Math.ceil(e.sets/2))
  return e.sets
}

const REC={

// جدول الراحة الافتراضي: أول يوم راحة (سباحة + بارد)، الثاني (حار مساءً)، الثالث (بارد + حار)
const REST_PATTERN=[
 [['swim','سباحة هادئة 20–30 دقيقة'],['cold','جاكوزي بارد 2–4 دقايق بعد السباحة']],
 [['hot','جاكوزي حار 15 دقيقة مساءً']],
 [['cold','جاكوزي بارد 2–4 دقايق'],['hot','جاكوزي حار 15 دقيقة (بعدها بساعة على الأقل)']]
]
function recPlan(settings){
  const days=[...settings.days].sort((a,b)=>a-b),out=[]
  let ri=0
  for(let d=0;d<7;d++){
    if(days.includes(d)){
      const key=DKEYS[settings.days.indexOf(d)]
      out.push({dow:d,train:true,key,items:[['hot','جاكوزي حار 10–15 دقيقة بعد التمرين أو مساءً (اختياري)']]})
    }else{out.push({dow:d,train:false,items:REST_PATTERN[Math.min(ri,REST_PATTERN.length-1)]});ri++}
  }
  return out
}

const keyForDow=(dow,s=S())=>{const i=s.days.indexOf(dow);return i<0?null:DKEYS[i]}
const logsOnDate=(d,date)=>d.log.filter(l=>l.date===date)
const e1=(w,r)=>w>0&&r>0?w*(1+Math.min(r,12)/30):0
function lastFor(id,before){
  const L=D().log.filter(l=>l.ex.some(e=>e.id===id)&&(!before||l.date<before)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0)[0]
  if(!L)return null
  const sets=L.ex.find(e=>e.id===id).sets;return sets.length?{date:L.date,sets}:null
}
function suggest(e,ph,before){
  const last=lastFor(e.id,before);if(!last)return null
  const ws=last.sets.map(s=>s.w||0),topW=Math.max(...ws),minR=Math.min(...last.sets.map(s=>s.r))
  let w=topW,r=Math.min(e.hi,minR+1),note=''
  if(minR>=e.hi){
    if(e.kind==='time'){r=e.hi;note='وصلت للحد الأعلى: زد الصعوبة (وضعية أصعب)'}
    else if(e.kind==='bw'){w=topW+e.inc;r=e.lo;note='وصلت للحد الأعلى: أضف وزن '+num(e.inc)+' كجم'}
    else{w=topW+e.inc;r=e.lo;note='وصلت للحد الأعلى: ارفع الوزن'}
  }
  if(ph.mode==='ramp'&&topW>0){w=roundTo(topW*(ph.idx===0?0.72:0.87),e.inc||1);r=e.lo;note=ph.idx===0?'أسبوع تأقلم: وزن أخف بكثير':'أسبوع تأقلم+: وزن أخف شوي'}
  if(ph.mode==='deload'&&topW>0){w=roundTo(topW*0.9,e.inc||1);r=e.lo;note='أسبوع تخفيف'}
  return {w,r,note,last}
}
function weekSets(d,ws){
  const out={};Object.keys(MUSCLES).forEach(k=>out[k]=0)
  d.log.filter(l=>l.date>=ws&&l.date<addDays(ws,7)).forEach(l=>l.ex.forEach(x=>{const e=EX[x.id];if(!e)return;const n=x.sets.length;out[e.m]+=n;(e.m2||[]).forEach(m=>out[m]+=n*0.5)}))
  return out
}
function planSets(ph){
  const out={},freq={};Object.keys(MUSCLES).forEach(k=>{out[k]=0;freq[k]=0})
  DKEYS.forEach(key=>{const seen=new Set();PROGRAM[key].ex.forEach(id=>{const e=EX[id],n=setsFor(e,ph);out[e.m]+=n;seen.add(e.m);(e.m2||[]).forEach(m=>{out[m]+=n*0.5;seen.add(m)})});seen.forEach(m=>freq[m]++)})
  return {sets:out,freq}
}
function sessionsPerWeek(d,weeks){
  const ws0=weekStart(todayStr()),out=[]
  for(let i=weeks-1;i>=0;i--){const ws=addDays(ws0,-7*i);out.push({ws,n:new Set(d.log.filter(l=>l.date>=ws&&l.date<addDays(ws,7)).map(l=>l.date)).size})}
  return out
}
function bestOf(d,id){
  let best=null
  d.log.forEach(l=>{const x=l.ex.find(e=>e.id===id);if(!x)return;x.sets.forEach(s=>{const v=EX[id].kind==='time'?s.r:(s.w>0?e1(s.w,s.r):s.r);if(!best||v>best.v)best={v,date:l.date,w:s.w,r:s.r}})})
  return best
}
function seriesFor(d,id){
  const e=EX[id],pts=[]
  d.log.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(l=>{const x=l.ex.find(q=>q.id===id);if(!x||!x.sets.length)return
    let v=0;x.sets.forEach(s=>{const val=e.kind==='time'?s.r:(s.w>0?e1(s.w,s.r):s.r);if(val>v)v=val});pts.push({date:l.date,v})})
  return pts
}
const sessionStats=l=>{let sets=0,vol=0;l.ex.forEach(x=>x.sets.forEach(s=>{sets++;vol+=(s.w||0)*s.r}));return {sets,vol}}

function genDemo(real){
  const d=clone(real);d.log=[];d.body=[];d.rec=[]
  const today=todayStr(),start=addDays(weekStart(today),-49);d.settings.startDate=start
  const r=rng(77),base={dbBench:24,dbRow:26,incDb:20,pullup:0,lateral:8,ohTri:18,incCurl:12,goblet:28,rdl:30,bss:14,legCurl:0,calf:16,legRaise:0,plank:0,ohp:18,bentRow:22,chinup:0,floorPress:24,rearDelt:6,skull:12,hammer:14,rdlHeavy:34,lunge:14,hipThrust:40,stepUp:14,seatedCalf:30,crunch:10,sidePlank:0}
  for(let w=0;w<8;w++){
    const wsd=addDays(start,w*7),ph=planWeek(d.settings,wsd)
    d.settings.days.forEach((dow,i)=>{
      const date=addDays(wsd,dow);if(date>today||r()<0.07)return
      const key=DKEYS[i],f=ph.mode==='ramp'?(ph.idx===0?0.72:0.87):ph.mode==='deload'?0.9:0.92+0.012*w
      const ex=PROGRAM[key].ex.map(id=>{const e=EX[id],n=setsFor(e,ph),bw=base[id]*f,sets=[]
        for(let s=0;s<n;s++){const reps=Math.max(e.lo,Math.min(e.hi,e.lo+Math.floor(r()*(e.hi-e.lo+1))-(s>1?1:0)));sets.push({w:e.kind==='time'||bw===0?0:Math.max(e.inc||1,roundTo(bw,e.inc||1)),r:reps})}
        return {id,sets}})
      d.log.push({id:uid(),date,dayKey:key,wk:ph.wk,idx:ph.idx,dur:50+Math.floor(r()*30),ex})
    })
    d.body.push({id:uid(),date:addDays(wsd,Math.min(6,1)),kg:+(69.3+w*0.16+(r()-.5)*.3).toFixed(1)})
    recPlan(d.settings).forEach(p=>{const date=addDays(wsd,p.dow);if(date>today)return;p.items.forEach(([t])=>{if(r()<0.75)d.rec.push({id:uid(),date,type:t,min:REC[t].defMin,temp:t==='cold'?12:t==='hot'?39:null})})})
  }
  return d
}

let gid=0
function ring(pct,{size=96,c1='#ff7a3d',c2,th=10,center=''}={}){
  const id='rg'+(++gid),p=Math.max(0,Math.min(100,pct))
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2||c1}"/></linearGradient></defs>
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="${th}"/>
  ${p>0.4?`<circle class="arc" cx="50" cy="50" r="42" fill="none" stroke="url(#${id})" stroke-width="${th}" stroke-linecap="round" pathLength="100" stroke-dasharray="${p} 100" transform="rotate(-90 50 50)"/>`:''}</svg><div class="ring-c">${center}</div></div>`
}
function oneLine(pts,{color='#ff7a3d',fmt=v=>num(v),pad:padv=0.0}={}){
  const n=pts.length,W=600,H=200,pr=10,pl=10,pt=18,pb=26
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),span=(mx-mn)||1,lo=mn-span*0.25,hi=mx+span*0.2
  const x=i=>n===1?W/2:W-pr-(i/(n-1))*(W-pl-pr),y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb)
  const P=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join('')
  const id='ol'+(++gid),area=P+`L${x(n-1).toFixed(1)} ${H-pb}L${x(0).toFixed(1)} ${H-pb}Z`
  const idx=n<=3?[...Array(n).keys()]:[0,Math.floor((n-1)/2),n-1]
  const ticks=idx.map(i=>`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${fmtD(pts[i].date)}</text>`).join('')
  const labs=[0,n-1].map(i=>`<text x="${x(i).toFixed(1)}" y="${(y(pts[i].v)-9).toFixed(1)}" text-anchor="middle" style="fill:#ecdcd2;font-size:12px;font-weight:700">${fmt(pts[i].v)}</text>`).join('')
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".34"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
   <path d="${area}" fill="url(#${id})"/><path d="${P}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i===n-1?5:3}" fill="${color}" stroke="#0d0a09" stroke-width="2"/>`).join('')}${labs}${ticks}</svg>`
}
function barsOne(items,target){
  const W=600,H=190,n=items.length,slot=(W-20)/n,bw=Math.min(34,slot*.5),pt=14,pb=28
  const mx=Math.max(target,...items.map(i=>i.n),1)*1.15,y=v=>pt+(1-v/mx)*(H-pt-pb),cx=i=>W-10-(i+.5)*slot
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="10" x2="${W-10}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" stroke="#e6c36a" stroke-dasharray="6 6" opacity=".8"/>
   ${items.map((it,i)=>`<rect x="${(cx(i)-bw/2).toFixed(1)}" y="${y(it.n).toFixed(1)}" width="${bw}" height="${Math.max(0,y(0)-y(it.n)).toFixed(1)}" rx="6" fill="${it.n>=target?'#3ddc97':'#ff7a3d'}"/><text x="${cx(i).toFixed(1)}" y="${y(it.n)-6}" text-anchor="middle" style="fill:#ecdcd2;font-size:12px;font-weight:700">${it.n}</text><text x="${cx(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${fmtD(it.ws).split(' ')[0]}/${P3(it.ws)[1]}</text>`).join('')}</svg>`
}

  <div class="card" style="margin-bottom:14px"><h3>هذا الأسبوع</h3><div style="display:flex;justify-content:space-around;gap:6px">${rings}</div><div class="note">الأهداف: بارد 2–3 · حار 2–3 · سباحة 1–2.</div></div>

   <div class="note">معلومات عامة للتوعية، وليست استشارة طبية. إذا عندك حالة صحية، اسأل طبيبك قبل الماء البارد أو الحار.</div></div>`
}

/* ---------- وضع التمرين ---------- */
function startDraft(key,date){
  const ph=planWeek(S(),date)
  DRAFT={id:uid(),date,dayKey:key,wk:ph.wk,idx:ph.idx,start:Date.now(),restEnd:0,restTot:0,
    ex:PROGRAM[key].ex.map(id=>{const e=EX[id],n=setsFor(e,ph);return{id,note:'',sets:Array.from({length:n},()=>({w:'',r:'',d:false}))}})}
  saveDraft()
}
const elapsedMin=()=>DRAFT?Math.max(0,Math.round((Date.now()-DRAFT.start)/60000)):0
function viewSession(){
  const d=DRAFT,p=PROGRAM[d.dayKey],ph=planWeek(S(),d.date)
  const tot=d.ex.reduce((a,x)=>a+x.sets.length,0),dn=d.ex.reduce((a,x)=>a+x.sets.filter(z=>z.d).length,0)
  const cards=d.ex.map((x,xi)=>{
    const e=EX[x.id],sg=suggest(e,ph,d.date),unitR=e.kind==='time'?'ثواني':'تكرار'
    return `<div class="card ex-card"><div class="ex-top"><div><div class="ex-n">${xi+1}. ${e.ar}</div><div class="ex-en">${e.en}</div></div><div class="ex-st"><b class="num">${x.sets.length} × ${e.lo}–${e.hi}</b><span>${e.per==='side'?'لكل جهة · ':''}راحة ${Math.floor(e.rest/60)}:${pad(e.rest%60)}</span></div></div>
     <div class="chip-row"><span class="mchip" style="color:${MCOLOR[e.m]}">${MUSCLES[e.m]}</span></div>
     ${sg?`<div class="sug">آخر مرة (${fmtD(sg.last.date)}): <b class="num">${sg.last.sets.map(s=>(s.w?s.w+'×':'')+s.r).join(' · ')}</b><br>اليوم جرّب: ${sg.w>0?`<b class="num">${num(sg.w)}</b> كجم × `:''}<b class="num">${sg.r}</b> ${sg.note?`<span class="faint">— ${sg.note}</span>`:''}</div>`:'<div class="sug">أول مرة بهذا التمرين: اختر وزن يخليك تنهي التكرارات وفاضل لك 3 تقريباً.</div>'}
     <button class="btn sm" data-act="cue" data-id="${e.id}">${ui.open[e.id]?'إخفاء الشرح':'كيف أسويه؟'}</button>${ui.open[e.id]?cueBox(e):''}
     <div class="set-h"><span></span><span>${e.kind==='time'?'—':'الوزن كجم'}</span><span>${unitR}</span><span></span></div>
     ${x.sets.map((st,si)=>`<div class="set-row ${st.d?'done':''}"><span class="n">${si+1}</span>
       <input inputmode="decimal" data-xi="${xi}" data-si="${si}" data-f="w" value="${esc(st.w)}" placeholder="${sg&&sg.w>0?num(sg.w):(e.kind==='time'?'—':'0')}" ${e.kind==='time'?'disabled':''}>
       <input inputmode="numeric" data-xi="${xi}" data-si="${si}" data-f="r" value="${esc(st.r)}" placeholder="${sg?sg.r:e.lo}">
       <button class="ok" data-act="setDone" data-xi="${xi}" data-si="${si}" aria-label="تم">✓</button></div>`).join('')}
     <div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" data-act="addSet" data-xi="${xi}">+ مجموعة</button>${x.sets.length>1?`<button class="btn sm" data-act="rmSet" data-xi="${xi}">− مجموعة</button>`:''}</div></div>`}).join('')
  return `<div class="sec-h"><h2>${p.ar}</h2><div style="display:flex;gap:8px;align-items:center"><span class="phase" id="elapsed">⏱ ${elapsedMin()} د</span></div></div>
  <div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div>${phChip(ph)}<div class="note" style="margin:8px 0 0">RIR: ${ph.rir} · ${ph.tip}</div></div></div>
   <div class="bar" style="margin-top:12px"><i id="sess-bar" style="width:${tot?dn/tot*100:0}%;background:var(--emerald)"></i></div><div class="faint" style="font-size:11.5px;margin-top:5px" id="sess-count">${dn} من ${tot} مجموعة</div>
   <div class="obs" style="margin:12px 0 0">🔥 تسخين: 5 دقايق خفيفة، ثم مجموعتين تسخين للتمرين الأول (نص الوزن ثم 75٪).</div></div>
  ${cards}
  <div class="dlg-a" style="margin:14px 0 8px"><button class="btn" data-act="cancelSess">إلغاء التمرين</button><button class="btn pri" data-act="finishSess">إنهاء وحفظ</button></div>
  <div id="rest-bar" class="rest-bar" hidden><div><div class="faint" style="font-size:11px">راحة</div><b class="num" id="rest-t" style="font-size:22px">0:00</b></div><div class="rest-prog"><i id="rest-p"></i></div><div style="display:flex;gap:6px"><button class="btn sm" data-act="restAdj" data-id="-15">−15</button><button class="btn sm" data-act="restAdj" data-id="15">+15</button><button class="btn sm" data-act="restSkip">تخطي</button></div></div>`
}
function tickTimer(){
  if(!DRAFT||!ui.inSession)return
  const eEl=$('#elapsed');if(eEl)eEl.textContent='⏱ '+elapsedMin()+' د'
  const bar=$('#rest-bar');if(!bar)return
  const left=Math.ceil((DRAFT.restEnd-Date.now())/1000)
  if(DRAFT.restEnd&&left>0){
    bar.hidden=false;$('#rest-t').textContent=Math.floor(left/60)+':'+pad(left%60);$('#rest-p').style.width=Math.max(0,Math.min(100,left/DRAFT.restTot*100))+'%'
  }else if(DRAFT.restEnd){
    DRAFT.restEnd=0;saveDraft();bar.hidden=true;beep()
  }else bar.hidden=true
}
function beep(){
  try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch(e){}
  try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();c.close()},260)}catch(e){}
}
let wakeLock=null
async function keepAwake(on){try{if(on&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen')}else if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
function toNum(v){const n=parseDec(v);return isFinite(n)?n:0}
function finishSession(){
  const d=D(),ph=planWeek(S(),DRAFT.date)
  const ex=DRAFT.ex.map(x=>({id:x.id,sets:x.sets.filter(s=>s.d&&toNum(s.r)>0).map(s=>({w:toNum(s.w),r:toNum(s.r)}))})).filter(x=>x.sets.length)
  if(!ex.length){toast('علّم مجموعة وحدة على الأقل (✓)');return}
  const prs=[]
  ex.forEach(x=>{const e=EX[x.id],prev=bestOf(d,x.id);let v=0;x.sets.forEach(s=>{const val=e.kind==='time'?s.r:(s.w>0?e1(s.w,s.r):s.r);if(val>v)v=val});if(prev&&v>prev.v+0.01)prs.push(e.ar)})
  const entry={id:DRAFT.id,date:DRAFT.date,dayKey:DRAFT.dayKey,wk:DRAFT.wk,idx:DRAFT.idx,dur:Math.max(1,elapsedMin()),ex}
  d.log.push(entry);persist();DRAFT=null;saveDraft();ui.inSession=false;keepAwake(false);render(false)
  const st=sessionStats(entry)
  openInfo('✅ خلصت التمرين',`<div class="gc-res" style="grid-template-columns:repeat(3,1fr)"><div><span>المدة</span><b>${entry.dur} د</b></div><div><span>المجموعات</span><b>${st.sets}</b></div><div><span>الحجم</span><b>${nfI(st.vol)} كجم</b></div></div>${prs.length?`<div class="obs">🏆 أرقام جديدة: ${prs.join('، ')}</div>`:''}<div class="note" style="margin-top:6px">الحين: ماء، وجبة فيها بروتين، ونوم كفاية. الجاكوزي الحار مناسب. الماء البارد بعد 4–6 ساعات على الأقل.</div>`)
}

  b.innerHTML=warn+(demoOn?'أنت في <b>وضع المعاينة</b>: الأرقام تجريبية لعرض التصميم فقط ولا تُحفظ. <button data-act="toggleDemo">اعرض بياناتي الحقيقية</button>':'')

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}

function openForm({title,sub,fields,submit='حفظ',onSubmit}){
  const dlg=$('#dlg'),vals={}
  fields.forEach(f=>vals[f.name]=f.value??'')
  const optsOf=f=>typeof f.options==='function'?f.options(vals):f.options
  const setVal=(n,v)=>{vals[n]=v;const el=$('[data-f="'+n+'"]',dlg);if(el&&el.tagName!=='BUTTON')el.value=v}
  const submitNow=()=>{
    const r=onSubmit(vals)
    if(typeof r==='string'){const e=$('#ferr');e.textContent=r;e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
    else dlg.close()
  }
  function paint(){
    dlg.innerHTML=`<div class="dlg-t">${title}</div>${sub?`<div class="dlg-s">${sub}</div>`:'<div style="height:10px"></div>'}
     <form id="ff" novalidate>${fields.map(f=>{
      let h=''
      if(f.type==='seg')h=`<div class="seg">${optsOf(f).map(o=>`<button type="button" data-f="${f.name}" data-v="${o.v}" class="${vals[f.name]===o.v?'on':''}">${o.l}</button>`).join('')}</div>`
      else if(f.type==='chips')h=`<div class="cats">${optsOf(f).map(o=>`<button type="button" class="cat ${vals[f.name]===o.v?'on':''}" data-f="${f.name}" data-v="${o.v}" style="${vals[f.name]===o.v?`border-color:${o.c};background:${o.c}26`:''}">${o.l}</button>`).join('')}</div>`
      else if(f.type==='select')h=`<select class="inp" data-f="${f.name}">${optsOf(f).map(o=>`<option value="${o.v}" ${vals[f.name]===o.v?'selected':''}>${o.l}</option>`).join('')}</select>`
      else if(f.type==='money')h=`<input class="inp money" inputmode="decimal" autocomplete="off" data-f="${f.name}" value="${esc(vals[f.name])}" placeholder="0">`
      else if(f.type==='dec')h=`<input class="inp" inputmode="decimal" autocomplete="off" data-f="${f.name}" value="${esc(vals[f.name])}" placeholder="${esc(f.ph||'0')}" style="direction:ltr;text-align:end">`
      else h=`<input class="inp" type="${f.type||'text'}" autocomplete="off" data-f="${f.name}" value="${esc(vals[f.name])}" placeholder="${esc(f.ph||'')}">`
      return `<div class="fld"><label>${f.label}</label>${h}${f.hint?`<div class="faint" style="font-size:11px;margin-top:5px">${f.hint}</div>`:''}</div>`}).join('')}
     <div class="dlg-foot"><div class="err" id="ferr" role="alert"></div>
      <div class="dlg-a"><button type="button" class="btn" id="fcancel">إلغاء</button><button type="submit" class="btn pri">${submit}</button></div></div></form>`
    $('#fcancel').onclick=()=>dlg.close()
    $('#ff').onsubmit=e=>{e.preventDefault();submitNow()}
    const ins=$$('input[data-f]:not([type=date])',dlg)
    ins.forEach((el,i)=>el.setAttribute('enterkeyhint',i<ins.length-1?'next':'done'))
    $$('[data-f]',dlg).forEach(el=>{
      const f=fields.find(x=>x.name===el.dataset.f)
      if(el.tagName==='BUTTON'){el.onclick=()=>{vals[f.name]=el.dataset.v;if(f.onChange)f.onChange(vals);paint()}}
      else{
        el.oninput=()=>{vals[f.name]=el.value;if(f.onInput)f.onInput(vals,setVal)}
        if(el.tagName==='INPUT'&&el.type!=='date')el.onkeydown=e=>{
          if(e.key!=='Enter')return;e.preventDefault()
          const i=ins.indexOf(el);if(i>=0&&i<ins.length-1)ins[i+1].focus();else submitNow()}
      }
    })
  }
  paint();if(dlg.open)dlg.close();dlg.showModal()
}

}

const GUIDE=`<div class="dlg-t">دليل الاستخدام</div><div class="guide">
<p class="lead">برنامج <b>علوي / سفلي</b> بأربعة أيام: كل عضلة تنضرب <b>مرتين</b> بالأسبوع. أيامك الافتراضية: الأحد (علوي A) · الاثنين (سفلي A) · الأربعاء (علوي B) · الجمعة (سفلي B). تغيّرها من ⚙.</p>
<h4>يوم التمرين</h4>
<ol><li>افتح <b>اليوم</b> واضغط <b>ابدأ التمرين</b>.</li><li>لكل تمرين: اكتب الوزن والتكرارات واضغط <b>✓</b> بعد كل مجموعة. يشتغل مؤقت الراحة لحاله.</li><li>«آخر مرة» و«اليوم جرّب» يوضحون لك وين توصل.</li><li>«كيف أسويه؟» تشرح الأداء الصحيح وبديل لو ما عندك الأداة.</li><li>اضغط <b>إنهاء وحفظ</b> لما تخلص.</li></ol>
<h4>كيف أتقدّم؟ (الزيادة المزدوجة)</h4>
<p>كل تمرين له مدى تكرارات (مثلاً 8–12). ابدأ بوزن تنهي فيه أدنى التكرارات، وكل مرة زد تكرارات. <b>لما توصل لأعلى المدى بكل المجموعات، ارفع الوزن</b> (1–2.5 كجم) وارجع لأدنى المدى. التطبيق يقترح لك الرقم.</p>
<h4>RIR والأسابيع</h4>
<p>RIR = كم تكرار كان باقي لك قبل الفشل. الدورة 8 أسابيع: <b>تأقلم (2) ← بناء (3) ← ذروة (2) ← تخفيف (1)</b>. أنت راجع من قطعة، فالأسبوعين الأولين أخف ومجموعات أقل. هذا يحميك من الإصابة ويرجّع الأداء أسرع.</p>
<h4>التعافي</h4>
<p>بارد: أيام الراحة (مو بعد الحديد مباشرة). حار: بعد التمرين أو مساءً، لا يتجاوز 40°م. سباحة هادئة 1–2 مرة بأيام الراحة. التفاصيل بتبويب <b>التعافي</b>.</p>
<h4>المزامنة</h4><p>سجّلت دخول؟ تمارينك تتزامن بين الجوال واللابتوب. مسودة التمرين اللي تعدّله الحين تنحفظ بالجهاز اللي تستخدمه فقط لين تضغط «إنهاء».</p>
<ul><li>هذا البرنامج عام ومبني على أساسيات التدريب، وما هو بديل عن مدرب أو طبيب.</li></ul></div>
<div class="dlg-foot"><div class="dlg-a"><button class="btn pri" id="gclose">تمام، فهمت</button></div></div>`

  if(DRAFT&&DRAFT.date===today&&DRAFT.dayKey!==key){toast('عندك تمرين شغّال، أنهِه أو الغِه أول');ui.inSession=true;render(false);return}
  if(!DRAFT)startDraft(key,today)
  ui.inSession=true;keepAwake(true);render(false);window.scrollTo(0,0)
}

 tab:id=>{ui.tab=id;ui.inSession=false;render(false);window.scrollTo({top:0})},

 },

 setDone:(id,el)=>{
  const xi=+el.dataset.xi,si=+el.dataset.si,x=DRAFT.ex[xi],st=x.sets[si],e=EX[x.id],ph=planWeek(S(),DRAFT.date)

  if(!(toNum(st.r)>0)){toast('اكتب التكرارات');return}
  st.d=true;DRAFT.restEnd=Date.now()+e.rest*1000;DRAFT.restTot=e.rest;saveDraft();render()
 },
 addSet:(id,el)=>{DRAFT.ex[+el.dataset.xi].sets.push({w:'',r:'',d:false});saveDraft();render()},
 rmSet:(id,el)=>{const x=DRAFT.ex[+el.dataset.xi];if(x.sets.length>1)x.sets.pop();saveDraft();render()},
 restAdj:id=>{if(DRAFT.restEnd){DRAFT.restEnd+=(+id)*1000;DRAFT.restTot=Math.max(15,DRAFT.restTot+(+id));saveDraft();tickTimer()}},
 restSkip:()=>{DRAFT.restEnd=0;saveDraft();tickTimer()},

 cancelSess:()=>askConfirm('إلغاء التمرين ومسح اللي سجّلته فيه؟',()=>{DRAFT=null;saveDraft();ui.inSession=false;keepAwake(false);render(false)},'إلغاء التمرين')

/* =====================================================================
   المزامنة بين الأجهزة (Firebase Firestore)
   كل نوع بيانات في مجموعة (collection) مستقلة تحت وثيقة المستخدم:
   users/{uid}/fin_tx · fin_pay · fin_debt · fin_inv · fin_meta/main
   (قسم الجامعة يبقى في users/{uid} نفسها، ما نلمسه)
   ===================================================================== */
const FB_VERSION='12.19.0'
const FIREBASE_CONFIG={
  apiKey:'AIzaSyBOAwmPFc6c5cU4a0HAfobg0Y0WeJQ9h1M',
  authDomain:'college-f2d9a.firebaseapp.com',
  projectId:'college-f2d9a',
  storageBucket:'college-f2d9a.firebasestorage.app',
  messagingSenderId:'1096865506361',
  appId:'1:1096865506361:web:675ecbe610eb61050819e8'
}
const COLS=[['log','fit_log'],['body','fit_body'],['rec','fit_rec']]
const SYNC_TIMEOUT_MS=10000
const SYNC={authReady:false,fs:null,au:null,auth:null,db:null,uid:null,ready:false,last:{},unsubs:[],first:{}}
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])):v)
const mapOf=arr=>Object.fromEntries(arr.map(x=>[x.id,canon(x)]))
const metaStr=()=>canon({settings:REAL.settings})
const sameMap=(a,b)=>{const ka=Object.keys(a),kb=Object.keys(b);return ka.length===kb.length&&ka.every(k=>a[k]===b[k])}
const colRef=c=>SYNC.fs.collection(SYNC.db,'users',SYNC.uid,c)
const docRef=(c,id)=>SYNC.fs.doc(SYNC.db,'users',SYNC.uid,c,id)

function setSyncStatus(kind,detail){
  const chip=$('#sync-chip')
  const map={
    off:['المزامنة: غير مفعّلة','',''],
    syncing:['↻ جارٍ المزامنة…','warn',''],
    ok:['● متزامن','ok',''],
    offline:['○ بدون اتصال — يتزامن لاحقاً','warn',''],
    needhttps:['⚠ افتح من رابط الموقع (https) عشان تتزامن','warn',''],
    error:['⚠ '+(detail||'خطأ مزامنة'),'err',detail||'']
  }
  const m=map[kind];chip.textContent=m[0];chip.className='sync-chip '+m[1];chip.title=m[2]
}
function errText(e){
  const code=(e&&e.code)||''
  if(code==='permission-denied')return 'رُفضت الصلاحيات: أضف قاعدة users/{uid}/{document=**} في Rules'
  if(code==='not-found'||code==='failed-precondition')return code+': أنشئ قاعدة Firestore من الكونسول'
  return code||String(e&&e.message||e)
}
function pushChanges(){
  if(!SYNC.ready)return
  const fs=SYNC.fs,fail=e=>setSyncStatus('error',errText(e))
  for(const [key,col] of COLS){
    const cur=mapOf(REAL[key]),last=SYNC.last[key]||{}
    for(const id in cur)if(cur[id]!==last[id])fs.setDoc(docRef(col,id),JSON.parse(cur[id])).catch(fail)
    for(const id in last)if(!(id in cur))fs.deleteDoc(docRef(col,id)).catch(fail)
    SYNC.last[key]=cur
  }
  const ms=metaStr()
  if(ms!==SYNC.last.meta){fs.setDoc(docRef('fit_meta','main'),JSON.parse(ms)).catch(fail);SYNC.last.meta=ms}
}
window.__fitPush=pushChanges

function applyMeta(m){if(m.settings)REAL.settings=Object.assign({},REAL.settings,m.settings)}
function tryFirst(){
  if([...COLS.map(c=>c[0]),'meta'].every(k=>k in SYNC.first))firstSync()
}
function firstSync(){
  const flag='fit_sync_init_'+SYNC.uid,R=SYNC.first
  const remoteEmpty=COLS.every(([k])=>!R[k].length)&&!R.meta
  if(remoteEmpty){
    // السيرفر فاضي: نرفع كل اللي عندنا
    COLS.forEach(([k])=>SYNC.last[k]={});SYNC.last.meta='';SYNC.ready=true;pushChanges()
  }else if(!localStorage.getItem(flag)){
    // أول مرة لهذا الجهاز: ندمج حسب المعرّف (السيرفر يفوز لو نفس المعرّف) بدون ما نخسر شي محلي
    COLS.forEach(([k])=>{const m=new Map(REAL[k].map(x=>[x.id,x]));R[k].forEach(x=>m.set(x.id,x));REAL[k]=[...m.values()]})
    if(R.meta)applyMeta(R.meta)
    COLS.forEach(([k])=>SYNC.last[k]=mapOf(R[k]));SYNC.last.meta=R.meta?metaStr():''
    SYNC.ready=true;pushChanges();saveLocal();render()
  }else{
    // جهاز معروف: السيرفر هو المرجع
    COLS.forEach(([k])=>REAL[k]=R[k]);if(R.meta)applyMeta(R.meta)
    COLS.forEach(([k])=>SYNC.last[k]=mapOf(R[k]));SYNC.last.meta=metaStr()
    SYNC.ready=true;saveLocal();render()
  }
  try{localStorage.setItem(flag,'1')}catch(e){}
}
function statusFrom(m){
  if(!navigator.onLine||m.fromCache)setSyncStatus('offline')
  else if(m.hasPendingWrites)setSyncStatus('syncing')
  else setSyncStatus('ok')
}
function onColSnap(key,snap){
  const arr=snap.docs.map(d=>d.data())
  if(!SYNC.ready){SYNC.first[key]=arr;tryFirst()}
  else{
    const rem=mapOf(arr)
    if(!sameMap(mapOf(REAL[key]),rem)){REAL[key]=arr;saveLocal();render()}
    SYNC.last[key]=rem
  }
  statusFrom(snap.metadata)
}
function onMetaSnap(snap){
  const m=snap.exists()?snap.data():null
  if(!SYNC.ready){SYNC.first.meta=m;tryFirst()}
  else if(m){
    const before=metaStr();applyMeta(m);const after=metaStr()
    if(before!==after){saveLocal();render()}
    SYNC.last.meta=after
  }
  statusFrom(snap.metadata)
}
function startSync(user){
  stopSync();SYNC.uid=user.uid;SYNC.first={};setSyncStatus('syncing')
  const fail=e=>setSyncStatus('error',errText(e)),o={includeMetadataChanges:true}
  COLS.forEach(([key,col])=>SYNC.unsubs.push(SYNC.fs.onSnapshot(colRef(col),o,snap=>onColSnap(key,snap),fail)))
  SYNC.unsubs.push(SYNC.fs.onSnapshot(docRef('fit_meta','main'),o,onMetaSnap,fail))
  updateAuthBtn(user)
}
function stopSync(){SYNC.unsubs.forEach(u=>u());SYNC.unsubs=[];SYNC.ready=false;SYNC.last={};SYNC.first={}}
function updateAuthBtn(user){
  const b=$('#auth-btn');b.style.display=''
  if(user){b.textContent='خروج';b.onclick=()=>{try{localStorage.removeItem('fit_sync_init_'+SYNC.uid)}catch(e){};SYNC.au.signOut(SYNC.auth)}}
  else{b.textContent='تسجيل الدخول';b.onclick=()=>{$('#login-msg').textContent='';$('#login-dlg').showModal()}}
}
const AUTH_ERR={
  'auth/invalid-credential':'الإيميل أو كلمة السر غلط','auth/invalid-email':'صيغة الإيميل غير صحيحة','auth/user-disabled':'هذا الحساب معطّل',
  'auth/too-many-requests':'محاولات كثيرة، انتظر شوي وجرّب مرة ثانية','auth/network-request-failed':'ما فيه اتصال بالإنترنت',
  'auth/operation-not-allowed':'الدخول بالإيميل غير مفعّل: Firebase ← Authentication ← Sign-in method'
}
function wireLogin(){
  const dlg=$('#login-dlg')
  $('#login-cancel').onclick=()=>dlg.close()
  $('#login-form').onsubmit=async ev=>{
    ev.preventDefault();const msg=$('#login-msg'),btn=$('#login-submit');msg.textContent='';btn.disabled=true;btn.textContent='…'
    try{await SYNC.au.signInWithEmailAndPassword(SYNC.auth,$('#login-email').value.trim(),$('#login-pass').value);$('#login-pass').value='';dlg.close()}
    catch(e){msg.textContent=AUTH_ERR[e.code]||('خطأ: '+(e.code||e.message))}
    finally{btn.disabled=false;btn.textContent='دخول'}
  }
}
function wireGate(){
  const $g=i=>document.getElementById(i),msg=$g('gate-msg'),btn=$g('gate-submit')
  $g('gate-form').onsubmit=async ev=>{
    ev.preventDefault();msg.textContent='';btn.disabled=true;btn.textContent='…'
    try{await SYNC.au.signInWithEmailAndPassword(SYNC.auth,$g('gate-email').value.trim(),$g('gate-pass').value);$g('gate-pass').value=''}
    catch(e){msg.textContent=AUTH_ERR[e.code]||('خطأ: '+(e.code||e.message))}
    finally{btn.disabled=false;btn.textContent='دخول'}
  }
  $g('gate-forgot').onclick=async()=>{
    const em=$g('gate-email').value.trim()
    if(!em){msg.textContent='اكتب إيميلك فوق أول، ثم اضغط «نسيت كلمة السر».';return}
    try{await SYNC.au.sendPasswordResetEmail(SYNC.auth,em);msg.textContent='إذا الإيميل مسجّل، بيوصلك رابط لإعادة تعيين كلمة السر (شيّك البريد المزعج).'}
    catch(e){msg.textContent=AUTH_ERR[e.code]||('خطأ: '+(e.code||e.message))}
  }
}
async function initSync(){
  wireLogin()
  GATE.checking();wireGate()
  const proto=location.protocol,weird=!(proto==='http:'||proto==='https:'||proto==='file:')
  if(weird){setSyncStatus('needhttps');GATE.error('افتح الصفحة من رابط الموقع (https) عشان تسجّل دخول. هذا الملف مفتوح من مكان ما يدعم تسجيل الدخول.')}
  const watchdog=setTimeout(()=>{if(!SYNC.authReady){setSyncStatus(weird?'needhttps':'error','ما استجاب Firebase خلال 10 ثواني. تأكد من الإنترنت وافتح الصفحة من رابط https');GATE.error(weird?'افتح الصفحة من رابط الموقع (https) عشان تسجّل دخول. هذا الملف مفتوح من مكان ما يدعم تسجيل الدخول.':'ما استجاب Firebase خلال 10 ثواني. تأكد من الإنترنت وجرّب مرة ثانية.')}},SYNC_TIMEOUT_MS)
  try{
    const base='https://www.gstatic.com/firebasejs/'+FB_VERSION+'/'
    const [appM,authM,fsM]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')])
    const app=appM.initializeApp(FIREBASE_CONFIG);SYNC.auth=authM.getAuth(app)
    try{SYNC.db=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})})}
    catch(e){SYNC.db=fsM.getFirestore(app)}
    SYNC.fs=fsM;SYNC.au=authM
    authM.onAuthStateChanged(SYNC.auth,user=>{
      SYNC.authReady=true;clearTimeout(watchdog)
      if(user){GATE.unlock();startSync(user)}else{GATE.form();stopSync();setSyncStatus('off');updateAuthBtn(null)}
    })
  }catch(e){clearTimeout(watchdog);setSyncStatus('error','تعذّر تحميل Firebase، تأكد من الإنترنت');GATE.error('تعذّر الاتصال بخدمة تسجيل الدخول. تأكد من الإنترنت وجرّب مرة ثانية.')}
}


if(DRAFT&&DRAFT.date===todayStr()){ui.tab='today'}
render(false)
initSync()
